/** นำเข้าไฟล์ JSON ทะเบียนนักเรียนจากระบบเดิม (รูปแบบ { ทะเบียนนักเรียน: [...] }) · อีเมลที่มีอยู่แล้วจะข้าม */
function adminStudentsImport_(d, p, admin) {
  var list = Array.isArray(d.rows) ? d.rows.slice(0, 1000) : [];
  var byTitle = {};
  read_('Courses').forEach(function (c) { byTitle[String(c.title).trim().toLowerCase()] = c; });
  var MAP = { 'ชำระแล้ว': 'approved', 'รอตรวจสอบ': 'pending', 'ยังไม่ชำระ': 'unpaid', approved: 'approved', pending: 'pending', unpaid: 'unpaid' };
  return withLock_(function () {
    ensureCols_('Users');
    var taken = {}, users = [], ens = [], skipped = 0, unmatched = {};
    read_('Users').forEach(function (u) { taken[u.email] = 1; });
    list.forEach(function (it) {
      var name = pick_(it, ['ชื่อ', 'name']);
      if (!name || name === '-') { skipped++; return; }
      var parts = name.split(/\s+/);
      var rawEmail = pick_(it, ['อีเมล', 'email']), email = '';
      try { email = rawEmail && rawEmail !== '-' ? normEmail_(rawEmail) : ''; } catch (x) { email = ''; }
      if (email && taken[email]) { skipped++; return; }
      var phone = '';
      try { phone = optPhone_(pick_(it, ['เบอร์โทร', 'phone'])); } catch (x) { phone = ''; }
      var courseTitle = pick_(it, ['คอร์ส', 'course']), c = byTitle[courseTitle.toLowerCase()];
      var note = pick_(it, ['บันทึก', 'notes', 'note']);
      if (courseTitle && !c && courseTitle !== '-' && courseTitle !== 'ยังไม่ลงคอร์ส') { unmatched[courseTitle] = 1; note = (note ? note + ' · ' : '') + 'คอร์สเดิม: ' + courseTitle; }
      var u = newStudent_({ first_name: parts[0].slice(0, 60), last_name: parts.slice(1).join(' ').slice(0, 60) || '-',
        nickname: dash_(pick_(it, ['ชื่อเล่น', 'nickname'])).slice(0, 30) || parts[0].slice(0, 30), school: dash_(pick_(it, ['โรงเรียน', 'school'])).slice(0, 120),
        grade: dash_(pick_(it, ['ชั้น', 'grade'])).slice(0, 20), phone: phone, admin_note: note.slice(0, 500) }, email);
      if (email) taken[email] = 1;
      users.push(u);
      if (c) {
        var st = MAP[pick_(it, ['สถานะชำระเงิน', 'paymentStatus', 'pay_status'])] || 'unpaid';
        var amt = pick_(it, ['ยอดโอน', 'amount']);
        ens.push({ enroll_id: 'E' + id_(), user_id: u.user_id, course_id: c.course_id, status: st, amount: String(amt === '' ? Number(c.price) || 0 : Math.max(0, Number(amt) || 0)),
          slip_file_id: '', note: 'นำเข้าจากระบบเดิม', created_at: now_(), decided_by: st === 'pending' ? '' : admin.user_id, decided_at: st === 'pending' ? '' : now_() });
      }
    });
    appendMany_('Users', users);
    appendMany_('Enrollments', ens);
    log_(admin, 'student.import', users.length + ' คน, ข้าม ' + skipped);
    return { added: users.length, enrolled: ens.length, skipped: skipped, unmatched_courses: Object.keys(unmatched) };
  });
}

function campOut_(r) {
  return { camp_id: r.camp_id, name: r.name, nickname: r.nickname, grade: r.grade, subject: r.subject, center: r.center,
    result: r.result || APP.CAMP_RESULTS[0], notes: r.notes, user_id: r.user_id, created_at: r.created_at, updated_at: r.updated_at };
}
function adminCamp_() {
  return {
    rows: read_('Camp').sort(function (a, b) { return a.created_at < b.created_at ? 1 : -1; }).map(campOut_),
    centers: APP.CAMP_CENTERS, subjects: APP.CAMP_SUBJECTS, results: APP.CAMP_RESULTS
  };
}
/** รับได้ทั้งคีย์ภาษาไทยจากไฟล์ JSON เดิม (ชื่อ, ชื่อเล่น, ชั้น, วิชา, ศูนย์, ผลค่าย1, บันทึก) และคีย์ภาษาอังกฤษ */
var CAMP_KEYS = { name: ['name', 'ชื่อ'], nickname: ['nickname', 'ชื่อเล่น'], grade: ['grade', 'ชั้น'], subject: ['subject', 'วิชา'],
  center: ['center', 'ศูนย์'], result: ['result', 'camp1Result', 'ผลค่าย1'], notes: ['notes', 'บันทึก'] };
var CAMP_MAX = { name: 120, nickname: 40, grade: 20, subject: 30, center: 120, result: 30, notes: 500 };
function campPatch_(d, partial) {
  var out = {};
  Object.keys(CAMP_KEYS).forEach(function (k) {
    var has = CAMP_KEYS[k].some(function (x) { return d[x] != null; });
    if (partial && !has) return;
    var v = clip_(pick_(d, CAMP_KEYS[k]), CAMP_MAX[k]);
    if (k === 'result' && APP.CAMP_RESULTS.indexOf(v) < 0) v = APP.CAMP_RESULTS[0];
    if (k === 'subject' && !v) v = APP.CAMP_SUBJECTS[0];
    if (k === 'center' && !v) v = 'ยังไม่ระบุ';
    out[k] = v;
  });
  if ('name' in out && !out.name) throw err_('BAD_INPUT', 'กรอกชื่อ - นามสกุล');
  return out;
}
function campRow_(d, userId) {
  var row = campPatch_(d, false);
  row.camp_id = 'C' + id_(); row.user_id = userId || ''; row.created_at = row.updated_at = now_();
  return row;
}
function adminCampSave_(d, p, admin) {
  return withLock_(function () {
    if (d.camp_id) {
      var r = findOne_('Camp', function (x) { return x.camp_id === d.camp_id; });
      if (!r) throw err_('NOT_FOUND', 'ไม่พบรายการนี้ (อาจถูกลบไปแล้ว)');
      var patch = campPatch_(d, true); patch.updated_at = now_();
      update_('Camp', r._row, patch);
      for (var k in patch) r[k] = patch[k];
      return campOut_(r);
    }
    var row = campRow_(d, '');
    append_('Camp', row); log_(admin, 'camp.create', row.name);
    return campOut_(row);
  });
}
function adminCampDelete_(d, p, admin) {
  withLock_(function () {
    var rows = read_('Camp').filter(function (r) { return r.camp_id === d.camp_id; });
    if (!rows.length) throw err_('NOT_FOUND', 'ไม่พบรายการนี้');
    deleteRows_('Camp', rows); log_(admin, 'camp.delete', rows[0].name);
  });
  return true;
}
/** นำเข้าไฟล์ JSON: mode 'append' ต่อท้าย หรือ 'replace' แทนที่ทั้งหมด */
function adminCampImport_(d, p, admin) {
  var list = Array.isArray(d.rows) ? d.rows.slice(0, 2000) : [];
  var rows = list.filter(function (it) { var n = pick_(it, CAMP_KEYS.name); return n && n !== '-'; }).map(function (it) { return campRow_(it, ''); });
  return withLock_(function () {
    if (d.mode === 'replace') clearTable_('Camp');
    appendMany_('Camp', rows);
    log_(admin, 'camp.import', (d.mode === 'replace' ? 'replace ' : 'append ') + rows.length);
    return { imported: rows.length, total: read_('Camp').length };
  });
}

var _ss = null, _cache = {};
function ss_() {

/** แท็บที่ยังไม่มี (ติดตั้งจากเวอร์ชันเก่าแล้วยังไม่ได้รัน setup ใหม่) จะถูกสร้างให้อัตโนมัติ */
function sheet_(name) {
  var sh = ss_().getSheetByName(name);
  if (!sh && SCHEMA[name]) { ss_().insertSheet(name); ensureCols_(name); sh = ss_().getSheetByName(name); }
  return sh;
}

/** อ่านทั้งแท็บเป็น array ของ object (อ้างคอลัมน์ตามชื่อหัวตาราง) */
function read_(name) {
  if (_cache[name]) return _cache[name].map(function (r) { return r; });
  var sh = sheet_(name), vals = sh.getDataRange().getValues();
  var head = vals[0].map(String), out = [];
  for (var i = 1; i < vals.length; i++) {
    var o = { _row: i + 1 }, empty = true;
    for (var j = 0; j < head.length; j++) { var v = vals[i][j]; o[head[j]] = v instanceof Date ? v.toISOString() : String(v); if (o[head[j]] !== '') empty = false; }
    if (!empty) out.push(o);
  }
  _cache[name] = out;
  return out.slice();
}
function headers_(name) { var sh = sheet_(name); return sh.getRange(1, 1, 1, sh.getLastColumn()).getValues()[0].map(String); }
/** เพิ่มคอลัมน์ที่ยังไม่มีต่อท้าย (ไม่แตะคอลัมน์เดิม) — ใช้ตอนอัปเดตระบบ */
function ensureCols_(name) {
  var sh = sheet_(name), want = SCHEMA[name];
  var have = sh.getLastColumn() ? sh.getRange(1, 1, 1, sh.getLastColumn()).getValues()[0].map(String).filter(String) : [];
  var miss = want.filter(function (c) { return have.indexOf(c) < 0; });
  if (!miss.length) return;
  var all = have.concat(miss);
  sh.getRange(1, 1, sh.getMaxRows(), all.length).setNumberFormat('@');
  sh.getRange(1, 1, 1, all.length).setValues([all]).setFontWeight('bold').setBackground('#f1f1f1');
  sh.setFrozenRows(1);
  delete _cache[name];
}
function findOne_(name, pred) { return read_(name).filter(pred)[0] || null; }
function append_(name, obj) {
  var sh = sheet_(name), head = headers_(name);
  var row = head.map(function (h) { return obj[h] == null ? '' : String(obj[h]); });
  var r = sh.getLastRow() + 1;
  sh.getRange(r, 1, 1, head.length).setNumberFormat('@').setValues([row]);
  delete _cache[name];
}
/** เขียนหลายแถวในครั้งเดียว (ใช้ตอนนำเข้าไฟล์ — เร็วกว่าเรียก append_ ทีละแถวมาก) */
function appendMany_(name, objs) {
  if (!objs.length) return;
  var sh = sheet_(name), head = headers_(name);
  var rows = objs.map(function (o) { return head.map(function (h) { return o[h] == null ? '' : String(o[h]); }); });
  sh.getRange(sh.getLastRow() + 1, 1, rows.length, head.length).setNumberFormat('@').setValues(rows);
  delete _cache[name];
}
/** ล้างข้อมูลทุกแถวยกเว้นหัวตาราง */
function clearTable_(name) {
  var sh = sheet_(name), n = sh.getLastRow();
  if (n > 1) sh.getRange(2, 1, n - 1, Math.max(1, sh.getLastColumn())).clearContent();
  delete _cache[name];
}
function update_(name, rowNum, patch) {
  var sh = sheet_(name), head = headers_(name);
  var rng = sh.getRange(rowNum, 1, 1, head.length), cur = rng.getValues()[0];
  head.forEach(function (h, i) { if (h in patch) cur[i] = patch[h] == null ? '' : String(patch[h]); });
  rng.setNumberFormat('@').setValues([cur]);
  delete _cache[name];
}
function deleteRows_(name, rows) {
  var sh = sheet_(name);
  rows.map(function (r) { return r._row; }).sort(function (a, b) { return b - a; }).forEach(function (n) { sh.deleteRow(n); });
  if (rows.length) delete _cache[name];
}
function withLock_(fn) {
  var lock = LockService.getScriptLock();
  lock.waitLock(20000);
  try { _cache = {}; return fn(); } finally { lock.releaseLock(); }
}

}
function getSetting_(k) { var s = allSettings_(); return k in s ? s[k] : DEFAULT_SETTINGS[k]; }

function pick_(o, keys) { for (var i = 0; i < keys.length; i++) if (o && o[keys[i]] != null && String(o[keys[i]]).trim() !== '') return String(o[keys[i]]).trim(); return ''; }

  if (!/^image\/(jpeg|png|webp)$/.test(d.mime || '')) throw err_('BAD_INPUT', 'อัปโหลดได้เฉพาะรูป JPG, PNG หรือ WEBP');

function compressImage(f, maxPx) {
  return new Promise(function (res, rej) {
    var rd = new FileReader();
    rd.onerror = rej;
    rd.onload = function () {
      var img = new Image();
      img.onerror = rej;
      img.onload = function () {
        var max = maxPx || 1400, s = Math.min(1, max / Math.max(img.width, img.height));
        var cv = document.createElement('canvas'); cv.width = Math.round(img.width * s); cv.height = Math.round(img.height * s);
        var g = cv.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, cv.width, cv.height); g.drawImage(img, 0, 0, cv.width, cv.height);
        res({ mime: 'image/jpeg', base64: cv.toDataURL('image/jpeg', 0.85).split(',')[1] });
      };
      img.src = rd.result;
    };
    rd.readAsDataURL(f);
  });
}
function promptpay(id, amount) {
  var f = function (t, v) { return t + ('0' + v.length).slice(-2) + v; };
  var n = String(id).replace(/\D/g, '');
  var acc = n.length >= 13 ? f('02', n) : f('01', ('0000000000000' + '66' + n.replace(/^0/, '')).slice(-13));
  var s = f('00', '01') + f('01', amount ? '12' : '11') + f('29', f('00', 'A000000677010111') + acc) + f('53', '764') + (amount ? f('54', Number(amount).toFixed(2)) : '') + f('58', 'TH') + '6304';
  var crc = 0xFFFF;
  for (var i = 0; i < s.length; i++) { crc ^= s.charCodeAt(i) << 8; for (var j = 0; j < 8; j++) crc = (crc & 0x8000 ? (crc << 1) ^ 0x1021 : crc << 1) & 0xFFFF; }
  return s + ('000' + crc.toString(16).toUpperCase()).slice(-4);
}

function bindOtp() {

  ins.forEach(function (inp, i) {
    inp.oninput = function () { inp.value = inp.value.replace(/\D/g, '').slice(-1); if (inp.value && ins[i + 1]) ins[i + 1].focus(); if (ins.every(function (x) { return x.value; })) $('#af button:not([type=button])').focus(); };
    inp.onkeydown = function (e) { if (e.key === 'Backspace' && !inp.value && ins[i - 1]) ins[i - 1].focus(); };
    inp.onpaste = function (e) { var t = (e.clipboardData.getData('text') || '').replace(/\D/g, '').slice(0, 6); if (!t) return; e.preventDefault(); t.split('').forEach(function (d, j) { if (ins[j]) ins[j].value = d; }); (ins[t.length] || ins[5]).focus(); };

function bindDrag(cid) {

    b.onclick = function () {
      var el = b.closest('.bwrap'), sib = b.dataset.bmv === '1' ? el.nextElementSibling : el.previousElementSibling;
      if (!sib) return;
      list.insertBefore(el, b.dataset.bmv === '1' ? sib.nextSibling : sib);
      saveBlockOrder(list);
    };
  });
}
function saveBlockOrder(list) {
  api('admin.blocks.reorder', { order: $$('.bwrap', list).map(function (x) { return x.dataset.bid; }) })
    .then(function () { S.blocks = null; toast('บันทึกลำดับใหม่แล้ว'); }).catch(function (x) { toast(x.message, true); viewAdmin('studio'); });
}
function swatches(name, val) {
  return '<span class="sw"><input type="hidden" name="' + name + '" value="' + esc(val) + '">' + SWATCH.map(function (c) {
    return '<button type="button" data-sw="' + name + '" data-c="' + c + '" style="background:' + c + '" aria-pressed="' + (c === val) + '" aria-label="สี ' + c + '"></button>';
  }).join('') + '<input type="color" data-swc="' + name + '" value="' + esc(hexc(val, '#ffffff')) + '" aria-label="เลือกสีเอง" title="เลือกสีเอง"></span>';
}
function blockModal(b) {
  openModal(mhead(b.block_id ? 'แก้ไขบล็อก' : 'บล็อกใหม่', blockName(b.type) + ' · ตัวอย่างด้านล่างอัปเดตตามที่พิมพ์') + '<div id="bprev"></div><form class="form" id="bf">' +
    field('heading', b.type === 'course' ? 'ชื่อคอร์ส / หัวข้อ' : 'หัวข้อ', b.heading) +
    field('sub', b.type === 'course' ? 'ราคา / คำอธิบาย' : 'คำอธิบาย (เว้นว่างได้)', b.sub, { area: true }) +
    '<div class="row2"><div class="fdiv">สีพื้น' + swatches('bg', b.bg) + '</div><div class="fdiv">สีตัวอักษร' + swatches('fg', b.fg) + '</div></div>' +
    (b.type !== 'banner' ? field('image_url', b.type === 'hero' ? 'รูปพื้นหลัง (ไม่ใส่ก็ได้)' : 'รูป (ไม่ใส่ก็ได้)', b.image_url, { ph: 'https://...', upload: true }) : '') +
    field('link_url', 'ลิงก์เมื่อกดบล็อก (ไม่ใส่ก็ได้)', b.link_url, { ph: '#/course/รหัสคอร์ส หรือ https://...', hint: 'ใส่ #/course/รหัสคอร์ส เพื่อพาไปหน้าคอร์สในเว็บนี้' }) +
    field('status', 'การแสดงผล', b.status || 'published', { options: [['published', 'แสดงบนหน้าแรก'], ['hidden', 'ซ่อนไว้ก่อน']] }) +
    '<p class="err" id="bf-err" hidden></p><div class="rowx"><button class="pill">บันทึกบล็อก</button>' + (b.block_id ? '<button type="button" class="pill danger" id="bf-del">ลบบล็อก</button>' : '') + '</div></form>', true);
  var f = $('#bf');
  var prev = function () { var d = formData(f); d.type = b.type; $('#bprev').innerHTML = blockHtml(d); };
  f.addEventListener('input', prev); f.addEventListener('change', prev);
  var setC = function (name, c) {
    f.querySelector('input[name=' + name + ']').value = c;
    $$('[data-sw="' + name + '"]', f).forEach(function (s) { s.setAttribute('aria-pressed', String(s.dataset.c === c)); });
    f.querySelector('[data-swc=' + name + ']').value = c; prev();
  };
  $$('[data-sw]', f).forEach(function (s) { s.onclick = function () { setC(s.dataset.sw, s.dataset.c); }; });
  $$('[data-swc]', f).forEach(function (s) { s.oninput = function () { setC(s.dataset.swc, s.value); }; });
  prev();
  submitForm('#bf', 'admin.block.save', '#bf-err', function () { S.blocks = null; closeModal(); toast('บันทึกบล็อกแล้ว'); viewAdmin('studio'); }, function () { return { type: b.type, block_id: b.block_id || '' }; });
  if ($('#bf-del')) $('#bf-del').onclick = function () {
    confirmBox('ลบบล็อกนี้?', 'บล็อก “' + b.heading + '” จะหายจากหน้าแรก', 'ลบบล็อก', true).then(function (y) {
      if (!y) return blockModal(b);
      api('admin.block.delete', { block_id: b.block_id }).then(function () { S.blocks = null; toast('ลบบล็อกแล้ว'); viewAdmin('studio'); }).catch(function (e) { toast(e.message, true); });
    });
  };
}
function aSettings(shell) {
  api('admin.settings').then(function (s) {
    shell('<h1>ตั้งค่า</h1><form class="card form" id="sf" style="max-width:640px">' +
      '<h3 style="font-size:16px">หน้าแรก</h3>' + field('hero_eyebrow', 'ข้อความเล็กเหนือหัวข้อ', s.hero_eyebrow) + field('hero_title', 'หัวข้อใหญ่ (ใส่ | เพื่อขึ้นบรรทัดใหม่ บรรทัดที่ 2 จะเป็นสีเขียว)', s.hero_title) + field('hero_subtitle', 'ข้อความใต้หัวข้อ', s.hero_subtitle) +
      '<h3 style="font-size:16px;margin-top:6px">ทั่วไป</h3>' + field('announcement', 'ประกาศบนหัวเว็บ (เว้นว่างเพื่อซ่อน)', s.announcement, { ph: 'เช่น เปิดรับสมัครคอร์สชีววิทยา สอวน. รอบ 2027 แล้ว' }) +
      '<div class="row2">' + field('promptpay_id', 'เบอร์หรือเลขบัตรพร้อมเพย์', s.promptpay_id, { mode: 'numeric' }) + field('promptpay_name', 'ชื่อบัญชีที่แสดงใต้ QR', s.promptpay_name) + '</div>' +
      '<div class="row2">' + field('contact_ig', 'IG ติดต่อ (ไม่ต้องใส่ @)', s.contact_ig) + field('contact_phone', 'เบอร์ติดต่อเรื่องด่วน', s.contact_phone) + '</div>' +
      '<h3 style="font-size:16px;margin-top:6px">ข้อตกลงและนโยบาย</h3><p class="hint">เว้นว่างไว้ = ใช้ข้อความมาตรฐานของระบบ ถ้าจะแก้ ให้กดปุ่มด้านล่างเพื่อใส่ข้อความมาตรฐานลงช่องแล้วแก้ต่อ ใช้ # หัวข้อใหญ่, ## หัวข้อย่อย, - รายการ และ {ig} {phone} แทนช่องทางติดต่อ</p>' +
      '<button type="button" class="pill quiet s" id="copy-legal" style="justify-self:start">ใส่ข้อความมาตรฐานลงในช่องเพื่อแก้ไข</button>' +
      field('terms_text', 'ข้อตกลงการใช้งาน', s.terms_text, { area: true }) + field('privacy_text', 'นโยบายความเป็นส่วนตัว', s.privacy_text, { area: true }) +
      field('admin_emails', 'อีเมลที่รับแจ้งเตือนคำขอใหม่ (คั่นด้วย , )', s.admin_emails, { ph: 'a@gmail.com, b@gmail.com' }) +
      '<p class="err" id="sf-err" hidden></p><button class="pill" style="justify-self:start">บันทึก</button></form>');
    $('#copy-legal').onclick = function () { if (!$('#f-terms_text').value) $('#f-terms_text').value = DEFAULT_TERMS; if (!$('#f-privacy_text').value) $('#f-privacy_text').value = DEFAULT_PRIVACY; };
    submitForm('#sf', 'admin.settings.save', '#sf-err', function () { toast('บันทึกแล้ว'); api('config').then(function (c) { S.cfg = c; }); });
  }).catch(function (e) { shell('<p class="err">' + esc(e.message) + '</p>'); });
}

/* ─── global events ─── */
document.addEventListener('click', function (e) {
  var t = e.target;
  var close = t.closest('[data-close]');
  if (close && (close.classList.contains('scrim') ? t === close : true)) { closeModal(); return; }
  var peek = t.closest('[data-peek]');
  if (peek) { var i = document.getElementById(peek.dataset.peek); i.type = i.type === 'password' ? 'text' : 'password'; peek.textContent = i.type === 'password' ? 'แสดง' : 'ซ่อน'; return; }
  var wb = t.closest('#who-btn'), menu = $('#who-menu');
  if (wb) { menu.hidden = !menu.hidden; wb.setAttribute('aria-expanded', String(!menu.hidden)); return; }
  if (menu && !menu.hidden && !t.closest('#who-menu')) menu.hidden = true;
  var a = t.closest('[data-act]');
  if (a) {
    var act = a.dataset.act;
    if (act === 'login') authModal('login');
    else if (act === 'signup') authModal('signup');
    else if (act === 'forgot') authModal('forgot', { email: ($('#f-email') || {}).value });
    else if (act === 'logout') signOut();
    return;
  }
  var f = t.closest('[data-filter]');
  if (f) { S.filter = f.dataset.filter; viewHome(); return; }
  if (t.closest('[data-top]')) { window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
  var ts = t.closest('[data-theme-set]');
  if (ts) { THEME = ts.dataset.themeSet; store('ib_theme', THEME === 'auto' ? null : THEME); applyTheme(); $$('[data-theme-set]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.themeSet === THEME)); }); toast(THEME === 'auto' ? 'ใช้ธีมตามเครื่อง' : THEME === 'dark' ? 'เปลี่ยนเป็นธีมมืด' : 'เปลี่ยนเป็นธีมสว่าง'); return; }
  var ry = t.closest('[data-ryear]'), rsb = t.closest('[data-rsub]');
  if (ry) { S.ryear = Number(ry.dataset.ryear); S.rsub = ''; viewResults(); return; }
  if (rsb) { S.rsub = rsb.dataset.rsub; viewResults(); return; }
  var upb = t.closest('[data-upload]');
  if (upb) { pickUpload(upb); return; }
  var lvb = t.closest('[data-lv]'), fsb = t.closest('[data-fsub]'), clr = t.closest('[data-clear]');
  if (lvb || fsb || clr) {
    e.preventDefault();
    if (lvb) S.lv = S.lv === lvb.dataset.lv ? '' : lvb.dataset.lv;
    if (fsb) { S.fsub = fsb.dataset.fsub; S.lv = ''; }
    if (clr) { var k = clr.dataset.clear; if (k === 'all') { S.lv = S.fsub = S.q = ''; } else S[k] = ''; var qi = $('#srch-q'); if (qi && (k === 'q' || k === 'all')) qi.value = ''; }
    var goHome = !/^#\/?$/.test(location.hash) && location.hash !== '';
    if (goHome) { location.hash = '/'; setTimeout(function () { var cc = document.getElementById('courses'); if (cc) cc.scrollIntoView({ behavior: 'smooth' }); }, 400); }
    else if (S.homeRender) { S.homeRender(); var cc = document.getElementById('courses'); if (cc) window.scrollTo({ top: cc.getBoundingClientRect().top + window.scrollY - 80, behavior: 'smooth' }); }
    return;
  }
  var j2 = t.closest('[data-jump2]');
  if (j2) { var g = document.getElementById(j2.dataset.jump2) || document.getElementById('courses'); if (g) window.scrollTo({ top: g.getBoundingClientRect().top + window.scrollY - 140, behavior: 'smooth' }); return; }
  var jp = t.closest('[data-jump]');
  if (jp) { var el = document.getElementById('sec-' + jp.dataset.jump); if (el) { var y = el.getBoundingClientRect().top + window.scrollY - 120; window.scrollTo({ top: y, behavior: 'smooth' }); } return; }
  var pv = t.closest('[data-preview]');
  if (pv) { previewVideo(pv.dataset.preview, pv.dataset.title); return; }
  var dm = t.closest('[data-demo]');
  if (dm && window.__DEMO) { var r = window.__DEMO.login(dm.dataset.demo); setSession(r); closeModal(); toast('สวัสดี ' + r.user.nickname); if (dm.dataset.demo === 'admin') go('/admin'); else route(); }
});
document.addEventListener('submit', function (e) {
  if (e.target.id !== 'srch') return;
  e.preventDefault(); S.q = $('#srch-q').value.trim(); S.lv = ''; S.fsub = '';
  if (location.hash && !/^#\/?$/.test(location.hash)) { location.hash = '/'; setTimeout(function () { var cc = document.getElementById('courses'); if (cc) cc.scrollIntoView(); }, 400); }
  else if (S.homeRender) { S.homeRender(); var cc = document.getElementById('courses'); if (cc) window.scrollTo({ top: cc.getBoundingClientRect().top + window.scrollY - 80, behavior: 'smooth' }); }
});
document.addEventListener('keydown', function (e) { if (e.key === 'Escape' && $('#modal').innerHTML) closeModal(); });
window.addEventListener('hashchange', function () {
  if (S.guard && location.hash !== S.guardHash) { if (!S.guard()) { history.replaceState(null, '', S.guardHash); return; } setGuard(false); }
  if ($('#modal .scrim')) closeModal(); if (!/^#\/learn\//.test(location.hash)) S.learn = null; route();
});

/* ─── boot ─── */
var BOOT = Date.now();
if (!DEMO && /PASTE_YOUR/.test(API_URL)) {
  var sp0 = document.getElementById('splash'); if (sp0) sp0.remove();
  document.getElementById('app').innerHTML = '<div class="gut"><div class="w empty" style="margin-top:60px"><h2>ยังไม่ได้ตั้งค่า API_URL</h2><p>เปิดไฟล์ index.html แล้ววาง URL ของ Apps Script Web App ในบรรทัด <code>var API_URL = ...</code></p></div></div>';
  return;
}
api('config').then(function (c) { S.cfg = c; }).catch(function () {})
  .then(function () { return S.token ? api('me').then(function (u) { S.user = u; }).catch(function () {}) : null; })
  .then(route)
  .then(function () { var sp = document.getElementById('splash'); if (!sp) return; setTimeout(function () { sp.classList.add('out'); setTimeout(function () { sp.remove(); }, 500); }, Math.max(0, 700 - (Date.now() - BOOT))); });
})();
</script>
