<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<!--HEAD-START-->
<title>INeedBio Classroom</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@300;400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcode-generator/1.4.4/qrcode.min.js"></script>
<style>
:root{
  --bg:#ffffff; --bg2:#f5f5f4; --bg3:#ececea; --ink:#0c0c0c; --ink2:#525252; --muted:#8a8a8a; --line:#e6e6e4;
  --inv:#0c0c0c; --inv-ink:#ffffff; --ok:#1f7a4d; --ok-soft:#e7f3ec; --wait:#8a5a00; --wait-soft:#fbf2df; --no:#a3261e; --no-soft:#fbe8e6;
  --sans:"Anuphan","Leelawadee UI",Tahoma,system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  --shadow:0 30px 80px rgba(0,0,0,.22);
  --c-bio:#16875a; --c-bio-soft:#e3f4ea; --c-chem:#d4541c; --c-chem-soft:#fdeadf; --c-phys:#2563d6; --c-phys-soft:#e5eefc; --c-math:#8246d4; --c-math-soft:#f0e8fb;
  --acc:var(--c-bio); --acc-soft:var(--c-bio-soft); --on-acc:#ffffff;
  --hero-a:#e3f4ea; --hero-b:#e5eefc;
  --foot-bg:#0f3d2a; --foot-ink:#ffffff; --foot-ink2:rgba(255,255,255,.72); --foot-line:rgba(255,255,255,.15);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
  --bg:#0b0b0b; --bg2:#161616; --bg3:#1f1f1f; --ink:#f2f2f2; --ink2:#b3b3b3; --muted:#7d7d7d; --line:#262626;
  --inv:#f2f2f2; --inv-ink:#0b0b0b; --ok:#6fcf9b; --ok-soft:#14261c; --wait:#e8b85c; --wait-soft:#2a2213; --no:#f08a82; --no-soft:#2d1817; --shadow:0 30px 80px rgba(0,0,0,.6);
  --c-bio:#5ad49a; --c-bio-soft:#12281d; --c-chem:#ff9a66; --c-chem-soft:#2e1a10; --c-phys:#7fa9ff; --c-phys-soft:#131f36; --c-math:#bf98ff; --c-math-soft:#231935; --on-acc:#0b0b0b; --hero-a:#10241a; --hero-b:#121c30; --foot-bg:#0c1f17;
}}
:root[data-theme="dark"]{color-scheme:dark;
  --bg:#0b0b0b; --bg2:#161616; --bg3:#1f1f1f; --ink:#f2f2f2; --ink2:#b3b3b3; --muted:#7d7d7d; --line:#262626;
  --inv:#f2f2f2; --inv-ink:#0b0b0b; --ok:#6fcf9b; --ok-soft:#14261c; --wait:#e8b85c; --wait-soft:#2a2213; --no:#f08a82; --no-soft:#2d1817; --shadow:0 30px 80px rgba(0,0,0,.6);
  --c-bio:#5ad49a; --c-bio-soft:#12281d; --c-chem:#ff9a66; --c-chem-soft:#2e1a10; --c-phys:#7fa9ff; --c-phys-soft:#131f36; --c-math:#bf98ff; --c-math-soft:#231935; --on-acc:#0b0b0b; --hero-a:#10241a; --hero-b:#121c30; --foot-bg:#0c1f17;
}
*{box-sizing:border-box}
.s-bio{--acc:var(--c-bio);--acc-soft:var(--c-bio-soft)} .s-chem{--acc:var(--c-chem);--acc-soft:var(--c-chem-soft)} .s-phys{--acc:var(--c-phys);--acc-soft:var(--c-phys-soft)} .s-math{--acc:var(--c-math);--acc-soft:var(--c-math-soft)}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;min-height:100vh}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.gut{padding-inline:16px}
.w{max-width:1080px;margin:0 auto}
h1,h2,h3{margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
.mono{font-size:13px;color:var(--muted);font-weight:500}
.muted{color:var(--muted)} .ink2{color:var(--ink2)}
.sm{font-size:13.5px}
.stack{display:grid;gap:12px}
.rowx{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

/* buttons */
.pill{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--acc);background:var(--acc);color:var(--on-acc);border-radius:999px;padding:6px 16px;font-size:14px;font-weight:500;line-height:1.5;white-space:nowrap;text-decoration:none;transition:opacity .15s}
.pill:hover{opacity:.86}
.pill.ghost{background:transparent;color:var(--acc)}
.pill.quiet{background:transparent;color:var(--ink2);border-color:var(--line)}
.pill.danger{background:transparent;color:var(--no);border-color:var(--no)}
.pill.s{padding:3px 11px;font-size:12.5px}
.pill.block{width:100%}
.pill:disabled{opacity:.35;cursor:not-allowed}
.link{border:0;background:none;padding:0;color:var(--ink2);font-size:14px;text-decoration:underline;text-underline-offset:3px}
.link:hover{color:var(--ink)}
.back{border:0;background:none;color:var(--ink2);padding:0;font-size:14px}
.back:hover{color:var(--ink)}
.spin{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .7s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}

/* header */
.demo-bar{background:var(--inv);color:var(--inv-ink);font-size:12.5px;text-align:center;padding:6px 16px}
.ann{background:var(--bg2);border-bottom:1px solid var(--line);font-size:13.5px;text-align:center;padding:8px 16px;color:var(--ink2)}
.hdr{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 86%,transparent);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-bottom:1px solid var(--line)}
.hdr .w{display:flex;align-items:center;gap:20px;height:58px}
.logo{font-weight:700;font-size:19px;letter-spacing:-.02em;text-decoration:none}
.logo>span>span{font-weight:400;color:var(--c-bio)}
.nav{display:flex;gap:20px;flex:1;font-size:14px}
.nav a{text-decoration:none;color:var(--ink2);padding:4px 0}
.nav a.on{color:var(--acc);font-weight:600} .nav a:hover{color:var(--ink)}
.who{position:relative}
.thm{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:2px;gap:0;background:var(--bg)}
.thm button{border:0;background:none;width:30px;height:28px;border-radius:999px;display:grid;place-items:center;color:var(--muted);padding:0}
.thm button[aria-pressed="true"]{background:var(--acc-soft);color:var(--acc)}
.thm button:hover{color:var(--ink)}
.hr{display:flex;align-items:center;gap:12px}
@media (max-width:560px){.hdr .w{gap:10px}.hr{gap:8px}.hr .pill.ghost{display:none}.thm button{width:26px}.who>button .sm{display:none}}
.who>button{display:flex;align-items:center;gap:8px;border:0;background:none;padding:4px;font-size:14px}
.av{width:32px;height:32px;border-radius:50%;background:var(--acc);color:var(--on-acc);display:grid;place-items:center;font-size:13px;font-weight:600;flex:none}
.menu{position:absolute;right:0;top:calc(100% + 8px);background:var(--bg);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);min-width:210px;padding:6px;display:grid;z-index:30}
.menu a,.menu button{display:block;text-align:left;border:0;background:none;padding:9px 12px;border-radius:9px;text-decoration:none;font-size:14px}
.menu a:hover,.menu button:hover{background:var(--bg2)}
.menu .hd{padding:8px 12px 10px;border-bottom:1px solid var(--line);margin-bottom:4px;font-size:13px}
.mnav{display:none}
@media (max-width:680px){
  .nav{display:none}
  .hdr .w{justify-content:space-between}
  .mnav{display:flex;position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--bg);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px))}
  .mnav a{flex:1;text-align:center;text-decoration:none;font-size:12px;color:var(--muted);padding:6px 0}
  .mnav a.on{color:var(--acc);font-weight:600}
  body.has-mnav{padding-bottom:64px}
}

/* home */
.hero{padding-block:48px 36px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:24px 40px;align-items:center}
.hero .txt{display:grid;gap:14px;justify-items:start}
.hero h1{font-size:clamp(34px,6vw,60px);line-height:1.12;font-weight:700;max-width:14ch;letter-spacing:-.02em}
.hero p{font-size:clamp(16px,2vw,19px);color:var(--ink2);max-width:40ch}
.hero .cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.mascot{width:clamp(150px,22vw,220px);aspect-ratio:1;border-radius:50%;background:var(--bg2);display:grid;place-items:center;position:relative}
.mascot img{width:86%;height:86%;object-fit:contain;border-radius:50%}
.mascot small{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%) rotate(-3deg);background:var(--ink);color:var(--bg);font-size:12.5px;padding:3px 12px;border-radius:8px;white-space:nowrap;font-weight:500}
@media (max-width:640px){.hero{grid-template-columns:1fr}.mascot{display:none}}
.filters{display:flex;gap:8px;flex-wrap:wrap;padding-block:6px 22px}
.chip{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:6px 16px;font-size:14px;color:var(--ink2)}
.chip[aria-pressed="true"]{border-color:var(--acc);background:var(--acc);color:var(--on-acc);font-weight:500}
.chip i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--acc);margin-right:7px;vertical-align:1px}
.chip[aria-pressed="true"] i{background:var(--on-acc)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;padding-bottom:64px}
@media (max-width:360px){.grid{grid-template-columns:1fr}}
.tile{background:var(--bg);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;text-decoration:none;overflow:hidden;transition:transform .2s,border-color .2s}
.tile:hover{transform:translateY(-2px);border-color:var(--ink2)}
.cover{aspect-ratio:16/9;background:var(--acc-soft);position:relative;overflow:hidden;display:block}
.cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.cover.typo{background:var(--acc);color:var(--on-acc);display:flex;flex-direction:column;justify-content:flex-end;padding:18px 20px}
.cover.typo b{font-size:clamp(40px,5vw,54px);line-height:1;font-weight:700;letter-spacing:-.02em}
.cover.typo small{position:absolute;top:14px;right:16px;font-size:12px;opacity:.75;font-weight:500}
.tile .body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
.tile .mono,.mc .mono,.ccard .mono,.cd .mono.sj,.lrow .mono{color:var(--acc);font-weight:600}
.tile h3{font-size:20px;font-weight:700;line-height:1.3}
.tile p{color:var(--ink2);font-size:14px}
.tile .foot{display:flex;justify-content:space-between;align-items:center;margin-top:auto;padding-top:10px;gap:8px}
.price{font-weight:600;font-size:17px;font-variant-numeric:tabular-nums}
.was{color:var(--muted);text-decoration:line-through;font-weight:400;font-size:.8em;margin-right:6px}
.badge{display:inline-block;font-size:12px;border-radius:999px;padding:2px 10px;font-weight:500;white-space:nowrap}
.b-ok{background:var(--ok-soft);color:var(--ok)} .b-wait{background:var(--wait-soft);color:var(--wait)} .b-no{background:var(--no-soft);color:var(--no)}
.b-inv{background:var(--acc);color:var(--on-acc)} .b-soft{background:var(--bg3);color:var(--ink2)}
.ask{display:flex;align-items:center;gap:18px;flex-wrap:wrap;border-top:1px solid var(--line);padding-block:32px 44px}
.ask img{width:64px;height:64px;border-radius:50%;background:var(--bg2)}
.ask div{flex:1;min-width:220px}
.ask h3{font-size:18px;font-weight:700}
.ask p{color:var(--ink2);font-size:14.5px}
footer.ft{border-top:1px solid var(--line);padding-block:26px 40px;color:var(--muted);font-size:13px}
footer.ft .w{display:flex;flex-wrap:wrap;gap:8px 24px;justify-content:space-between}
footer.ft a{color:var(--ink2)}

/* course */
.cd{display:grid;grid-template-columns:1.45fr 1fr;gap:44px;padding-block:28px 72px;align-items:start}
@media (max-width:840px){.cd{grid-template-columns:1fr;gap:28px}}
.cd h1{font-size:clamp(28px,4.4vw,44px);line-height:1.2;margin-block:8px 12px}
.meta{display:flex;gap:18px;flex-wrap:wrap;color:var(--ink2);font-size:14px;margin-block:14px 28px}
.desc{color:var(--ink2);white-space:pre-line;max-width:62ch;margin-bottom:28px}
.syl{border-top:1px solid var(--line)}
.syl details{border-bottom:1px solid var(--line)}
.syl summary{list-style:none;display:flex;justify-content:space-between;gap:12px;padding:15px 2px;font-weight:500;cursor:pointer}
.syl summary::-webkit-details-marker{display:none}
.syl summary .n{color:var(--muted);font-weight:400;font-size:13.5px;white-space:nowrap}
.syl ul{list-style:none;margin:0;padding:0 0 12px}
.syl li{display:flex;justify-content:space-between;gap:12px;padding:6px 2px;color:var(--ink2);font-size:14px;align-items:center}
.syl li .d{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
.buy{position:sticky;top:84px;border:1px solid var(--line);background:var(--bg);border-radius:24px;padding:24px;display:grid;gap:14px}
.buy .price{font-size:32px}
.qrbox{background:#fff;color:#000;border-radius:16px;padding:14px;display:grid;justify-items:center;gap:6px;border:1px solid var(--line)}
.qrbox svg{width:170px;height:auto;max-width:100%}
.qrbox .pp{font-weight:700;letter-spacing:.02em;font-size:13px;color:#0c3b6e}
.qrbox small{color:#555;font-size:12px;text-align:center}
.drop{border:1.5px dashed var(--line);border-radius:14px;padding:16px;text-align:center;color:var(--ink2);font-size:14px;background:none;width:100%;display:grid;gap:8px;justify-items:center}
.drop.has{border-style:solid;border-color:var(--ok)}
.drop img{max-height:160px;border-radius:8px}
.steps{display:grid;gap:4px;font-size:13.5px;color:var(--ink2);padding-left:18px;margin:0}
.note{border-radius:12px;padding:12px 14px;font-size:14px}
.note.no{background:var(--no-soft);color:var(--no)} .note.wait{background:var(--wait-soft);color:var(--wait)} .note.ok{background:var(--ok-soft);color:var(--ok)} .note.plain{background:var(--bg2);color:var(--ink2)}

.chero{display:grid;gap:10px}
.chero .lead{font-size:17px;max-width:52ch}
.facts{display:flex;gap:8px;flex-wrap:wrap;margin-block:8px 4px}
.facts span{background:var(--acc-soft);border-radius:999px;padding:5px 14px;font-size:13.5px;color:var(--ink2)}
.facts b{color:var(--acc);font-weight:600}
.trailer{margin-top:10px}
.jump{position:sticky;top:calc(env(safe-area-inset-top,0px) + 58px);z-index:10;background:var(--bg);display:flex;gap:4px;overflow-x:auto;padding-block:10px;margin-top:22px;border-bottom:1px solid var(--line)}
.jump button{border:0;background:none;border-radius:999px;padding:6px 14px;font-size:14px;color:var(--ink2);white-space:nowrap}
.jump button:hover{background:var(--acc-soft);color:var(--acc)}
.sec{display:grid;gap:14px;padding-top:34px}
.sec h2{font-size:22px;font-weight:700}
.hl{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px}
.hl>div{display:flex;gap:10px;align-items:flex-start;background:var(--acc-soft);border-radius:16px;padding:14px 16px;font-size:14.5px}
.hl .ic,.incl svg{color:var(--acc);flex:none;margin-top:2px}
.aud{margin:0;padding:0;list-style:none;display:grid;gap:8px}
.aud li{display:flex;gap:10px;font-size:15px}
.aud li::before{content:"→";color:var(--acc);font-weight:700}
.desc{margin-bottom:0}
.inst{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap;border:1px solid var(--line);border-radius:22px;padding:22px;background:linear-gradient(135deg,var(--acc-soft),var(--bg) 60%)}
.inst .ph{width:88px;height:88px;border-radius:50%;background:var(--acc);color:var(--on-acc);display:grid;place-items:center;font-size:34px;font-weight:700;overflow:hidden;flex:none;position:relative}
.inst .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.bl{margin:4px 0 0;padding:0;list-style:none;display:grid;gap:6px}
.bl li{display:flex;gap:10px;font-size:14.5px;color:var(--ink2)}
.bl li::before{content:"•";color:var(--acc);font-weight:700}
.acc{color:var(--acc);font-weight:500}
.faq p{margin:0;padding:0 2px 16px;color:var(--ink2);font-size:14.5px;white-space:pre-line}
.faq details[open] summary .n{transform:rotate(45deg)}
.faq summary .n{font-size:20px;line-height:1;color:var(--acc);transition:transform .2s}
.incl{list-style:none;margin:0;padding:0;display:grid;gap:7px;font-size:14px;color:var(--ink2);border-block:1px solid var(--line);padding-block:14px}
.incl li{display:flex;gap:8px;align-items:flex-start}
.incl svg{width:16px;height:16px}
.mbar{display:none}
@media (max-width:840px){
  .mbar{display:flex;align-items:center;justify-content:space-between;gap:12px;position:fixed;left:0;right:0;bottom:0;z-index:24;background:var(--bg);border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 30px -20px rgba(0,0,0,.3)}
  .mbar>div{display:grid;min-width:0}.mbar .sm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .cd{padding-bottom:110px}
  .buy{position:static}
}
@media (max-width:680px){body.has-mnav .mbar{bottom:calc(44px + env(safe-area-inset-bottom,0px));padding-bottom:10px}}
/* page header */
.page-h{padding-block:44px 22px;display:grid;gap:6px}
.page-h h1{font-size:clamp(28px,4vw,40px)}
.mine{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;padding-bottom:72px}
.mc{border:1px solid var(--line);background:linear-gradient(180deg,var(--acc-soft),var(--bg) 70%);border-radius:20px;padding:22px;display:flex;flex-direction:column;gap:12px}
.mc h3{font-size:20px;font-weight:600}
.mc .act{margin-top:auto;padding-top:4px}
.bar{height:6px;background:var(--acc-soft);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--acc);border-radius:99px;transition:width .4s}
.empty{border:1px dashed var(--line);border-radius:20px;padding:44px 20px;text-align:center;color:var(--ink2);display:grid;gap:14px;justify-items:center}

/* learn */
.lhdr{display:flex;align-items:center;gap:14px;height:54px}
.lhdr .t{flex:1;font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.learn{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:0}
@media (max-width:920px){.learn{grid-template-columns:minmax(0,1fr)}}
.stage{padding:20px 0 40px;display:grid;gap:16px;align-content:start;min-width:0}
@media (min-width:921px){.stage{padding-right:24px}}
.player{aspect-ratio:16/9;width:100%;background:#050505;border-radius:16px;position:relative;overflow:hidden;color:#fff}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.player .ph{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:12px;text-align:center;padding:16px;font-size:14px;color:rgba(255,255,255,.7)}
.player .play{width:68px;height:68px;border-radius:50%;background:rgba(255,255,255,.12);display:grid;place-items:center;border:1px solid rgba(255,255,255,.25);margin:0 auto}
.wm{position:absolute;font-family:var(--mono);font-size:11px;color:rgba(255,255,255,.35);pointer-events:none;transition:top 2s,left 2s;white-space:nowrap;text-shadow:0 0 2px rgba(0,0,0,.6)}
.lrow{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap}
.lrow h2{font-size:22px;font-weight:600}
.files{display:flex;gap:10px;flex-wrap:wrap}
.file{border:1px solid var(--line);border-radius:12px;padding:10px 14px;font-size:14px;display:flex;gap:10px;align-items:center;text-decoration:none}
.file:hover{border-color:var(--acc)}
.file b{font-family:var(--mono);font-size:11px;background:var(--acc-soft);color:var(--acc);border-radius:6px;padding:2px 6px;font-weight:500}
.lside{border-left:1px solid var(--line);padding:18px 0 40px 18px;display:grid;gap:2px;align-content:start}
@media (min-width:921px){.lside{position:sticky;top:0;max-height:100vh;overflow:auto}}
@media (max-width:920px){.lside{border-left:0;border-top:1px solid var(--line);padding-left:0}}
.lside .prog{display:grid;gap:6px;margin-bottom:10px}
.chap{font-size:13px;font-weight:600;padding:14px 8px 4px}
.ep{display:grid;grid-template-columns:22px 1fr auto;gap:8px;align-items:center;text-align:left;border:0;background:none;padding:8px;border-radius:10px;font-size:14px;color:var(--ink2);text-decoration:none}
.ep:hover{background:var(--bg2)}
.ep.on{background:var(--acc);color:var(--on-acc)}
.ep.on.done .ck{background:var(--on-acc);color:var(--acc);border-color:var(--on-acc)}
.ep .ck{width:18px;height:18px;border-radius:50%;border:1.5px solid currentColor;display:grid;place-items:center;font-size:11px;opacity:.6}
.ep.done .ck{background:var(--ok);border-color:var(--ok);color:#fff;opacity:1}
.ep .d{font-family:var(--mono);font-size:12px;opacity:.7}

/* forms */
.form{display:grid;gap:14px}
.card{border:1px solid var(--line);border-radius:20px;padding:22px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:560px){.row2{grid-template-columns:1fr}}
label.f{display:grid;gap:5px;font-size:13px;color:var(--ink2);align-content:start}
input.i,select.i,textarea.i{border:1px solid var(--line);border-radius:11px;padding:10px 12px;background:var(--bg);font-size:15px;width:100%}
textarea.i{min-height:96px;resize:vertical}
input.i:focus,select.i:focus,textarea.i:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.chk{display:flex;gap:8px;align-items:center;font-size:14px}
.err{color:var(--no);font-size:13.5px}
.hint{font-size:12.5px;color:var(--muted)}
.pw{position:relative}
.pw button{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:none;font-size:12.5px;color:var(--muted)}

/* admin */
.adm{display:grid;grid-template-columns:210px minmax(0,1fr);min-height:calc(100vh - 60px)}
@media (max-width:780px){.adm{grid-template-columns:minmax(0,1fr)}}
.aside{border-right:1px solid var(--line);padding:22px 12px 22px 0;display:flex;flex-direction:column;gap:2px}
@media (max-width:780px){.aside{flex-direction:row;overflow-x:auto;border-right:0;border-bottom:1px solid var(--line);padding:10px 0}}
.aside a{text-decoration:none;padding:9px 12px;border-radius:10px;color:var(--ink2);white-space:nowrap;display:flex;justify-content:space-between;gap:10px;font-size:14.5px}
.aside a.on{background:var(--acc-soft);color:var(--acc);font-weight:600}
.aside .n{font-family:var(--mono);font-size:12px;background:var(--c-chem);color:var(--on-acc);border-radius:99px;padding:0 7px;line-height:20px}
.amain{padding:26px 0 70px 30px;display:grid;grid-template-columns:minmax(0,1fr);gap:22px;align-content:start;min-width:0}
@media (max-width:780px){.amain{padding-left:0}}
.amain h1{font-size:26px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.kpi{border:1px solid var(--line);border-radius:18px;padding:16px 18px;display:grid;gap:2px}
.kpi b{font-size:28px;font-weight:600;font-variant-numeric:tabular-nums}
.kpi span{font-size:13px;color:var(--ink2)}
.kpi.hot{background:var(--c-chem);color:var(--on-acc);border-color:var(--c-chem)}
.kpi.k1{background:var(--c-bio-soft);border-color:transparent} .kpi.k2{background:var(--c-phys-soft);border-color:transparent} .kpi.k3{background:var(--c-math-soft);border-color:transparent}
.kpi.hot span{color:inherit;opacity:.75}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:18px}
table{border-collapse:collapse;width:100%;font-size:14px}
th{font-weight:500;color:var(--muted);text-align:left;font-size:12.5px;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:12px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td .sub{color:var(--muted);font-size:12.5px}
.num{font-variant-numeric:tabular-nums;text-align:right}
.acts{display:flex;gap:6px;justify-content:flex-end}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:999px;padding:3px;gap:2px;background:var(--bg)}
.seg button{border:0;background:none;border-radius:999px;padding:4px 14px;color:var(--ink2);font-size:13.5px}
.seg button[aria-pressed="true"]{background:var(--acc);color:var(--on-acc)}
.ytprev{display:flex;gap:14px;align-items:center;border-radius:12px;background:var(--bg2);padding:10px;font-size:13.5px}
.ytprev .th{width:120px;aspect-ratio:16/9;border-radius:8px;background:#0a0a0a;flex:none;display:grid;place-items:center;color:#fff;overflow:hidden}
.ytprev .th img{width:100%;height:100%;object-fit:cover}
.list{border:1px solid var(--line);border-radius:18px;overflow:hidden}
.li{display:grid;grid-template-columns:22px minmax(0,1fr) auto auto;gap:12px;align-items:center;padding:10px 14px;border-bottom:1px solid var(--line);font-size:14px;background:var(--bg)}
.li:last-child{border-bottom:0}
.li .h{color:var(--muted);cursor:grab;user-select:none;letter-spacing:-2px;text-align:center}
.li .t{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.li .d{font-family:var(--mono);font-size:12px;color:var(--muted);white-space:nowrap}
.li.cap{background:var(--acc-soft);color:var(--acc);font-weight:600;font-size:13px;grid-template-columns:1fr auto}
.li.drag{opacity:.4}
.li.over{box-shadow:inset 0 2px 0 var(--acc)}
.ccard{border:1px solid var(--line);background:linear-gradient(180deg,var(--acc-soft),var(--bg) 80%);border-radius:18px;padding:18px;display:grid;gap:8px;text-decoration:none}
.ccard:hover{border-color:var(--acc)}
.cgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);display:grid;place-items:center;z-index:50;padding:16px;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--bg);border-radius:24px;width:min(460px,100%);max-height:calc(100vh - 32px);overflow:auto;padding:28px;display:grid;gap:16px;box-shadow:var(--shadow)}
.modal.wide{width:min(680px,100%)}
.msec{border-top:1px solid var(--line);padding-top:14px;margin-top:4px;display:grid;gap:2px}
.msec:first-child{border-top:0;padding-top:0;margin-top:0}
.msec h3{font-size:15px;color:var(--acc)}
.modal h2{font-size:24px}
.mx{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.x{border:0;background:none;font-size:24px;line-height:1;color:var(--muted);padding:0 4px}
.otp{display:flex;gap:8px;justify-content:center}
.otp input{width:46px;height:58px;text-align:center;font-size:24px;font-family:var(--mono);padding:0;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
.otp input:focus{outline:none;border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
@media (max-width:380px){.otp input{width:38px;height:50px;font-size:20px}}
.tabs{display:flex;gap:4px;background:var(--bg2);border-radius:999px;padding:3px}
.tabs button{flex:1;border:0;background:none;border-radius:999px;padding:7px}
.tabs button[aria-pressed="true"]{color:var(--acc);background:var(--bg);box-shadow:0 1px 3px rgba(0,0,0,.12);font-weight:500}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:26px;height:4px;border-radius:9px;background:var(--line)}
.dots i.on{background:var(--acc)}
.slipimg{max-width:100%;max-height:60vh;border-radius:12px;margin:0 auto;display:block}
.toasts{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:70;display:grid;gap:8px;justify-items:center;width:max-content;max-width:calc(100vw - 32px)}
.toast{background:var(--ink);color:var(--bg);border-radius:999px;padding:10px 20px;font-size:14px;box-shadow:var(--shadow);animation:fade .2s}
.toast.bad{background:var(--no);color:#fff}
.mailcard{position:fixed;right:16px;top:calc(16px + env(safe-area-inset-top,0px));z-index:80;width:min(320px,calc(100vw - 32px));background:var(--bg);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:14px 16px;display:grid;gap:4px;font-size:13.5px;animation:fade .2s}
.mailcard b.code{font-family:var(--mono);font-size:22px;letter-spacing:.2em}
.loading{display:grid;place-items:center;padding:80px 0;color:var(--muted)}

/* ─── home v2 ─── */
.srch{flex:1;max-width:320px;position:relative}
.srch input{width:100%;border:1px solid var(--line);background:var(--bg2);border-radius:999px;padding:7px 14px 7px 34px;font-size:14px}
.srch input:focus{outline:none;border-color:var(--acc);background:var(--bg)}
.srch svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted)}
@media (max-width:900px){.srch{display:none}}
.nav{flex:0 0 auto}
.hdr .w{justify-content:space-between}
.logo{display:flex;align-items:center;gap:8px}
.logo img{width:34px;height:34px;border-radius:50%;background:var(--bg2)}
.h2x{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,.95fr);gap:40px;align-items:center;padding-block:44px 28px}
@media (max-width:860px){.h2x{grid-template-columns:1fr;gap:26px;padding-top:28px}}
.h2x .kick{display:flex;align-items:center;gap:10px;font-size:12.5px;font-weight:600;letter-spacing:.12em;color:var(--acc);text-transform:uppercase}
.h2x .kick::before{content:"";width:28px;height:2px;background:var(--acc)}
.h2x h1{font-size:clamp(38px,6.4vw,68px);line-height:1.08;font-weight:800;letter-spacing:-.03em;margin-block:14px 16px}
.h2x h1 em{font-style:normal;color:var(--acc)}
.h2x p.lead{font-size:clamp(16px,1.8vw,18px);color:var(--ink2);max-width:42ch}
.h2x .cta{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.h2x .pill{padding:8px 18px;font-size:14.5px}
.feat{position:relative;border-radius:22px;overflow:hidden;background:var(--bg2);aspect-ratio:4/3;display:block;text-decoration:none;border:1px solid var(--line)}
.feat .slide{position:absolute;inset:0;opacity:0;transition:opacity .6s ease;display:block}
.feat .slide.on{opacity:1}
.feat .slide .cover{position:absolute;inset:0;aspect-ratio:auto;height:100%}
.feat .slide .cover img{object-fit:contain}
.feat .slide .cover.typo{justify-content:center;align-items:center;padding-bottom:70px}
.feat .slide .cover.typo b{font-size:clamp(64px,9vw,104px)}
.feat .slide .cover.typo small{left:18px;right:auto}
.feat .info{position:absolute;left:14px;right:14px;bottom:14px;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(8px);border-radius:14px;padding:12px 14px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.feat .info b{display:block;font-size:16px;line-height:1.3}
.feat .info span{font-size:13px;color:var(--ink2)}
.feat .info .pill{color:var(--on-acc);font-size:12.5px;flex:none}
.feat .dots2{position:absolute;top:14px;right:14px;display:flex;gap:6px}
.feat .dots2 i{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.55);cursor:pointer;box-shadow:0 0 0 1px rgba(0,0,0,.15)}
.feat .dots2 i.on{background:#fff;width:20px;border-radius:9px}
.sec-h{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:14px}
.sec-h h2{font-size:clamp(22px,3vw,28px);font-weight:800;letter-spacing:-.02em}
.sec-h small{display:block;font-size:12px;font-weight:600;letter-spacing:.12em;color:var(--acc);text-transform:uppercase;margin-bottom:4px}
.sec-h a,.sec-h button{font-size:14px;color:var(--ink2);text-decoration:none;border:0;background:none;padding:0;white-space:nowrap}
.sec-h a:hover,.sec-h button:hover{color:var(--acc)}
.blk{padding-block:28px}
.paths{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.path{border:1px solid var(--line);background:var(--bg);border-radius:16px;padding:16px;text-align:left;display:grid;gap:2px;transition:border-color .2s,transform .15s}
.path:hover{border-color:var(--acc);transform:translateY(-2px)}
.path[aria-pressed="true"]{border-color:var(--acc);background:var(--acc-soft)}
.path b{font-size:20px;font-weight:800;letter-spacing:-.01em}
.path span{font-size:13px;color:var(--ink2)}
.path em{font-style:normal;font-size:12px;color:var(--acc);font-weight:600;margin-top:6px}
.subj-chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.hs{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(260px,300px);gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:10px;scrollbar-width:thin}
.hs>*{scroll-snap-align:start}
.tile .cover .off{position:absolute;left:12px;top:12px;background:#e0262d;color:#fff;font-size:12px;font-weight:700;padding:3px 10px;border-radius:999px}
.tile .cover .lv{position:absolute;right:12px;bottom:12px;background:rgba(0,0,0,.55);color:#fff;font-size:12px;font-weight:600;padding:3px 10px;border-radius:999px}
.cover.typo .lv{background:rgba(255,255,255,.2)}
.results-h{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:14px}
.results-h .x2{border:1px solid var(--line);background:var(--bg);border-radius:999px;padding:4px 12px;font-size:13px}
.why{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.why>div{border:1px solid var(--line);border-radius:18px;padding:22px;display:grid;gap:8px;align-content:start;background:var(--bg)}
.why b.n{font-size:34px;font-weight:800;color:var(--acc);line-height:1;letter-spacing:-.02em}
.why h3{font-size:17px;font-weight:700}
.why p{font-size:14px;color:var(--ink2)}
.chan{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
.chan a{display:flex;align-items:center;gap:14px;border-radius:18px;padding:18px 20px;text-decoration:none;color:#fff;transition:transform .15s}
.chan a:hover{transform:translateY(-2px)}
.chan a.ig{background:linear-gradient(120deg,#f58529,#dd2a7b 50%,#8134af)}
.chan a.tel{background:var(--ink);color:var(--bg)}
.chan a b{display:block;font-size:17px}
.chan a span{font-size:13px;opacity:.85}
.chan svg{flex:none}
.fab{position:fixed;right:16px;bottom:calc(20px + env(safe-area-inset-bottom,0px));z-index:22;display:grid;gap:8px}
.fab a,.fab button{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;border:1px solid var(--line);background:var(--bg);color:var(--ink);box-shadow:0 8px 24px -10px rgba(0,0,0,.35);text-decoration:none}
.fab a.ig{background:linear-gradient(120deg,#f58529,#dd2a7b 50%,#8134af);color:#fff;border:0}
body.has-mnav .fab{bottom:calc(76px + env(safe-area-inset-bottom,0px))}
.bigfoot{background:var(--foot-bg);color:var(--foot-ink);margin-top:36px;padding-block:44px 28px}
.bigfoot .w{display:grid;grid-template-columns:1.4fr 1fr 1fr;gap:32px}
@media (max-width:760px){.bigfoot .w{grid-template-columns:1fr}}
.bigfoot .brand{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:800}
.bigfoot .brand img{width:44px;height:44px;border-radius:50%;background:#fff}
.bigfoot p{color:var(--foot-ink2);font-size:14px;margin-top:10px;max-width:46ch}
.bigfoot h4{margin:0 0 10px;font-size:14px;color:var(--foot-ink)}
.bigfoot ul{list-style:none;margin:0;padding:0;display:grid;gap:7px;font-size:14px}
.bigfoot a{color:var(--foot-ink2);text-decoration:none}
.bigfoot a:hover{color:var(--foot-ink)}
.bigfoot .stat{display:flex;gap:22px;margin-top:16px;flex-wrap:wrap}
.bigfoot .stat b{display:block;font-size:24px;font-weight:800;color:var(--foot-ink)}
.bigfoot .stat span{font-size:12.5px;color:var(--foot-ink2)}
.bigfoot .copy{grid-column:1/-1;border-top:1px solid var(--foot-line);padding-top:18px;font-size:12.5px;color:var(--foot-ink2)}

/* ─── hall of fame ─── */
.k{display:block;font-size:12px;font-weight:600;letter-spacing:.12em;color:var(--acc);text-transform:uppercase;margin-bottom:4px}
.hof{margin-top:8px}
.hof-top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.hof-top h2{font-size:clamp(22px,3vw,30px);font-weight:800;letter-spacing:-.02em}
.hof-sub{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.hof-sub span{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--ink2);border:1px solid var(--line);border-radius:999px;padding:3px 12px 3px 9px;background:var(--bg)}
.hof-sub i{width:8px;height:8px;border-radius:50%;background:var(--acc)}
.hof-sub b{color:var(--ink)}
.hof-num{display:flex;align-items:baseline;gap:6px}
.hof-num b{font-size:clamp(56px,8vw,84px);line-height:.9;font-weight:800;color:var(--acc);letter-spacing:-.04em}
.hof-num span{font-size:18px;font-weight:700}
.marq{overflow:hidden;margin-inline:-16px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent);mask-image:linear-gradient(90deg,transparent,#000 5%,#000 95%,transparent)}
.marq-track{display:flex;width:max-content;animation:marq var(--dur,40s) linear infinite}
.marq-set{display:flex;gap:18px;padding:14px 18px 22px 0}
.marq-set .pola{width:150px;flex:none}
@keyframes marq{to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.marq{overflow-x:auto;-webkit-mask-image:none;mask-image:none}.marq-track{animation:none}.marq-set[aria-hidden]{display:none}}
.polas{display:grid;grid-auto-flow:column;grid-auto-columns:150px;gap:18px;overflow-x:auto;padding:10px 4px 18px;scroll-snap-type:x proximity;scrollbar-width:thin}
.pola{scroll-snap-align:start;background:#fff;border-radius:6px;padding:8px 8px 10px;box-shadow:0 10px 22px -12px rgba(0,0,0,.35),0 0 0 1px rgba(0,0,0,.05);transform:rotate(var(--r,0deg));transition:transform .2s;text-decoration:none;color:#111;display:grid;gap:2px;text-align:center}
.pola:hover{transform:rotate(0) translateY(-4px)}
.pola .sp{display:block;aspect-ratio:1;border-radius:3px;overflow:hidden;background:#f1f1ef;margin-bottom:6px}
.pola .sp img{width:100%;height:100%;object-fit:cover}
.pola .sp img.cat{object-fit:contain;padding:12px}
.pola b{font-size:15px;line-height:1.3}
.pola small{font-size:12px;color:var(--acc);font-weight:600}
.res-h{padding-block:40px 18px;display:grid;gap:6px}
.res-h h1{font-size:clamp(30px,5vw,48px);font-weight:800;letter-spacing:-.02em}
.res-stats{display:flex;gap:12px;flex-wrap:wrap;margin-top:14px}
.res-stats>div{border:1px solid var(--line);border-radius:16px;padding:12px 18px;min-width:110px;display:grid}
.res-stats>div b{font-size:28px;font-weight:800;color:var(--acc);line-height:1.1}
.res-stats>div span{font-size:13px;color:var(--ink2)}
.res-stats .big{background:var(--acc);border-color:var(--acc)}
.res-stats .big b,.res-stats .big span{color:var(--on-acc)}
.rvs{columns:3 300px;column-gap:16px}
.rvs.two{columns:2 280px}
.rv{break-inside:avoid;margin-bottom:16px;border:1px solid var(--line);background:var(--bg);border-radius:18px;padding:16px 18px;display:grid;gap:10px;transition:box-shadow .3s}
.rv.hl-on{box-shadow:0 0 0 3px var(--acc)}
.rv-h{display:flex;align-items:center;gap:12px}
.rv-ph{width:52px;height:52px;border-radius:50%;overflow:hidden;flex:none;background:var(--bg2)}
.rv-ph img{width:100%;height:100%;object-fit:cover}
.rv-ph img.cat{object-fit:contain}
.rv-h b{display:block;font-size:16px}
.rv-h span{font-size:12.5px;color:var(--ink2);line-height:1.4;display:block}
.rv-tags{display:flex;gap:6px;flex-wrap:wrap}
.rv-sj{font-size:12px;font-weight:600;color:var(--on-acc);background:var(--acc);border-radius:999px;padding:2px 10px}
.rv-c{font-size:12px;color:var(--ink2);background:var(--bg2);border-radius:999px;padding:2px 10px}
.rv-q{font-size:14.5px;line-height:1.75;white-space:pre-line;position:relative;padding-left:14px;border-left:3px solid var(--acc-soft)}
.tb-ph{display:block;width:40px;height:40px;border-radius:50%;overflow:hidden;background:var(--bg2)}
.tb-ph img{width:100%;height:100%;object-fit:cover}
.upl{display:flex;gap:8px;align-items:center}
.upl .i{flex:1}
.upl-prev img{max-height:90px;border-radius:10px;margin-top:6px}

/* ─── signup goals + legal ─── */
.gbox{border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:grid;gap:8px;background:var(--bg2)}
.gbox b{font-size:14px}
.consent{display:flex;gap:10px;align-items:flex-start;font-size:13.5px;color:var(--ink2);line-height:1.6}
.consent input{margin-top:4px;width:18px;height:18px;flex:none;accent-color:var(--acc)}
.consent .link{font-size:13.5px;color:var(--acc)}
.legal{max-width:760px;padding-block:32px 60px}
.legal h2{font-size:clamp(26px,4vw,36px);font-weight:800;margin:14px 0 12px}
.legal h3{font-size:18px;font-weight:700;margin:24px 0 8px}
.legal p,.legal li{color:var(--ink2);font-size:15px;line-height:1.8}
.legal ul{margin:0;padding-left:20px;display:grid;gap:4px}
.legal.in-modal{padding:0;max-height:55vh;overflow:auto}
.legal.in-modal h3{margin-top:14px}
.legal a.chip{text-decoration:none}
.dream{margin:8px 0 0;padding-left:20px;display:grid;gap:6px}
.dream li{font-size:14px}
.dream li b{float:right;font-weight:600;color:var(--acc)}
.bigfoot .copy a{color:var(--foot-ink2)}

/* ─── motion ─── */
.topbar{position:fixed;left:0;top:0;height:2px;width:0;background:var(--ink);z-index:120;opacity:0;transition:width .4s ease,opacity .3s ease;pointer-events:none}
.topbar.on{opacity:1}
#splash{position:fixed;inset:0;z-index:200;background:var(--bg);display:grid;place-items:center;align-content:center;gap:10px;transition:opacity .35s ease,visibility .35s}
#splash.out{opacity:0;visibility:hidden}
#splash img{width:96px;height:96px;border-radius:50%;background:var(--bg2);animation:bob 1.4s ease-in-out infinite}
#splash b{font-size:15px;font-weight:600;color:var(--ink2)}
@keyframes bob{0%,100%{transform:translateY(0) rotate(-2deg)}50%{transform:translateY(-6px) rotate(2deg)}}
.pg-enter{animation:pgIn .42s cubic-bezier(.2,.8,.2,1) both}
.pg-fade{animation:pgFade .25s ease both}
@keyframes pgIn{from{opacity:0;transform:translateY(6px)}}
@keyframes pgFade{from{opacity:0}}
.rise{animation:rise .55s cubic-bezier(.2,.8,.2,1) both;animation-delay:calc(var(--i,0) * 70ms)}
@keyframes rise{from{opacity:0;transform:translateY(22px) scale(.98)}}
.pill:active,.tile:active,.chip:active,.ep:active,.file:active{transform:scale(.97)}
.pill,.chip{transition:opacity .15s,transform .12s,background .2s,color .2s}
.modal{animation:pop .2s ease-out}
@keyframes pop{from{opacity:0;transform:translateY(6px)}}
.player{animation:pgFade .35s ease both}
.bar i{transition:width .8s cubic-bezier(.2,.8,.2,1)}
.sk{background:linear-gradient(90deg,var(--bg2) 25%,var(--bg3) 45%,var(--bg2) 65%);background-size:300% 100%;animation:shim 1.3s ease-in-out infinite;border-radius:12px}
@keyframes shim{0%{background-position:100% 0}100%{background-position:0 0}}
.sk-tile{border-radius:24px;min-height:340px;padding:26px;display:grid;gap:14px;align-content:start;background:var(--bg2)}
.sk-l{height:14px}.sk-h{height:26px;width:70%}.sk-img{height:120px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* ─── รูปโปรไฟล์ ─── */
.av{overflow:hidden;position:relative}
.av img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.avbig{width:84px;height:84px;font-size:30px}
.avcard{display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.avsu{display:grid;justify-items:center;gap:6px}
.avsu button{border:1.5px dashed var(--line);background:var(--bg2);width:84px;height:84px;border-radius:50%;padding:0;overflow:hidden;display:grid;place-items:center;font-size:12.5px;color:var(--muted);position:relative}
.avsu button:hover{border-color:var(--acc)}
.avsu button img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}

/* ─── ทะเบียนนักเรียน / ผลค่าย ─── */
.tbl .av{width:34px;height:34px;font-size:13px}
.who-cell{display:flex;gap:10px;align-items:center;min-width:200px}
.kpis.k5{grid-template-columns:repeat(auto-fit,minmax(128px,1fr))}
.tbl input.i[data-note],.tbl input.i[data-cnote]{width:100%;min-width:120px}
input.i.s,select.i.s{padding:5px 9px;font-size:13px;border-radius:9px;width:auto;min-width:130px}
select.i.s{padding-right:6px}
.pay-approved,.r1{border-color:var(--ok)!important;color:var(--ok);background:var(--ok-soft)!important;font-weight:500}
.pay-pending,.r2{border-color:var(--wait)!important;color:var(--wait);background:var(--wait-soft)!important;font-weight:500}
.pay-rejected,.r3{border-color:var(--no)!important;color:var(--no);background:var(--no-soft)!important}
.pay-unpaid,.r0{color:var(--ink2)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip b{font-weight:600;margin-left:7px;font-variant-numeric:tabular-nums;opacity:.75}
.fbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.fbar input.i{flex:1;min-width:220px;width:auto}
.fbar select.i{width:auto}
.fbar .seg{max-width:100%;overflow-x:auto;scrollbar-width:none}
.fbar .seg button{white-space:nowrap;flex:none}
.savebar{position:sticky;bottom:14px;z-index:15;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;background:var(--inv);color:var(--inv-ink);border-radius:16px;padding:10px 12px 10px 18px;box-shadow:var(--shadow);font-size:14px}
.savebar .pill{background:var(--inv-ink);color:var(--inv);border-color:var(--inv-ink)}
.savebar .pill.quiet{background:transparent;color:var(--inv-ink);border-color:color-mix(in srgb,var(--inv-ink) 40%,transparent)}
.stc{margin:0;padding:0;list-style:none;display:grid;gap:6px}
.stc li{display:flex;justify-content:space-between;gap:10px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:8px 12px;font-size:14px}
.ctr{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.ctr button{border:1px solid var(--line);background:var(--bg);border-radius:14px;padding:9px 12px;text-align:left;display:grid;gap:0}
.ctr button b{font-size:12.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctr button span{font-size:15px;font-weight:700;color:var(--acc)}
.ctr button.zero span{color:var(--muted);font-weight:500}
.ctr button[aria-pressed="true"]{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.kpi.ok{background:var(--ok-soft);border-color:transparent} .kpi.wait{background:var(--wait-soft);border-color:transparent} .kpi.no{background:var(--no-soft);border-color:transparent}

/* ─── Design Studio ─── */
.studio{display:grid;grid-template-columns:190px minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.studio{grid-template-columns:1fr}}
.lib{display:grid;gap:8px}
@media (min-width:901px){.lib{position:sticky;top:84px}}
.lib button{border:1px solid var(--line);background:var(--bg2);border-radius:14px;padding:12px;text-align:left;display:grid;gap:2px}
.lib button:hover{border-color:var(--acc)}
.lib button b{font-size:14px} .lib button span{font-size:12.5px;color:var(--ink2)} .lib button em{font-style:normal;font-size:12px;color:var(--acc);font-weight:600;margin-top:4px}
.canvas{display:grid;gap:12px;min-width:0}
.bwrap{border:1px solid var(--line);border-radius:20px;padding:8px;background:var(--bg);display:grid;gap:8px}
.bwrap.hid .pblk{opacity:.45}
.bwrap .bt{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:0 4px;flex-wrap:wrap}
.bwrap .h{cursor:grab;color:var(--muted);letter-spacing:-2px;user-select:none}
.bwrap.drag{opacity:.35} .bwrap.over{box-shadow:0 -3px 0 var(--acc)}
.canvas .pblk,#bprev .pblk{pointer-events:none}
#bprev{border:1px dashed var(--line);border-radius:22px;padding:6px}
.fdiv{display:grid;gap:5px;font-size:13px;color:var(--ink2);align-content:start}
.sw{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.sw button{width:26px;height:26px;border-radius:50%;border:2px solid var(--line);padding:0}
.sw button[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--acc)}
.sw input[type=color]{width:34px;height:28px;border:1px solid var(--line);border-radius:8px;padding:1px;background:var(--bg);cursor:pointer}

/* ─── บล็อกบนหน้าแรก ─── */
.pblks{display:grid;gap:14px;padding-block:8px 12px}
.pblk{display:block;border-radius:20px;overflow:hidden;text-decoration:none;position:relative}
a.pblk{transition:transform .15s} a.pblk:hover{transform:translateY(-2px)}
.pblk h2,.pblk h3,.pblk p{margin:0}
.pblk p{white-space:pre-line;opacity:.78}
.pblk.t-banner{padding:15px 22px;text-align:center}
.pblk.t-banner b{font-size:17px;font-weight:700} .pblk.t-banner span{display:block;font-size:14px;opacity:.78;margin-top:2px}
.pblk.t-course{display:flex;align-items:center;gap:18px;padding:18px 22px}
.pblk.t-course .im{width:120px;aspect-ratio:4/3;border-radius:12px;overflow:hidden;flex:none;background:rgba(127,127,127,.18)}
.pblk.t-course .im img{width:100%;height:100%;object-fit:cover;display:block}
.pblk.t-course h3{font-size:20px;font-weight:800} .pblk.t-course p{font-size:14.5px;margin-top:4px}
.pblk.t-feature{padding:26px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:18px;align-items:center}
.pblk.t-feature h3{font-size:22px;font-weight:800} .pblk.t-feature p{font-size:15px;margin-top:6px}
.pblk.t-feature img{width:190px;max-width:36vw;border-radius:14px;display:block}
.pblk.t-hero{padding:46px 28px;text-align:center;display:grid;gap:8px;justify-items:center}
.pblk.t-hero .bgi{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.32}
.pblk.t-hero h2,.pblk.t-hero p{position:relative}
.pblk.t-hero h2{font-size:clamp(26px,4vw,40px);font-weight:800;letter-spacing:-.02em;max-width:24ch}
.pblk.t-hero p{font-size:16px;max-width:52ch}
@media (max-width:560px){.pblk.t-course{flex-direction:column;align-items:flex-start}.pblk.t-course .im{width:100%}.pblk.t-feature{grid-template-columns:1fr}.pblk.t-feature img{width:100%;max-width:none}}
.qrbox img.qrimg{width:190px;max-width:100%;border-radius:8px;display:block}
</style>

      H[0]=(H[0]+a)|0;H[1]=(H[1]+b)|0;H[2]=(H[2]+c)|0;H[3]=(H[3]+d)|0;H[4]=(H[4]+e)|0;H[5]=(H[5]+f)|0;H[6]=(H[6]+g)|0;H[7]=(H[7]+h)|0;
    }
    var out = [];
    H.forEach(function (v) { for (var i = 3; i >= 0; i--) { var bt = (v >>> (i * 8)) & 255; out.push(bt > 127 ? bt - 256 : bt); } });
    return out;
  }

  function Range(sh, r, c, nr, nc) { this.sh = sh; this.r = r; this.c = c; this.nr = nr; this.nc = nc; }
  Range.prototype.getValues = function () {
    var out = [];
    for (var i = 0; i < this.nr; i++) { var row = []; for (var j = 0; j < this.nc; j++) { var R = this.sh.rows[this.r - 1 + i]; row.push(R && R[this.c - 1 + j] != null ? R[this.c - 1 + j] : ''); } out.push(row); }
    return out;
  };
  Range.prototype.setValues = function (v) {
    for (var i = 0; i < this.nr; i++) { var R = this.sh.rows[this.r - 1 + i] || (this.sh.rows[this.r - 1 + i] = []); for (var j = 0; j < this.nc; j++) R[this.c - 1 + j] = v[i][j]; }
    for (var k = 0; k < this.sh.rows.length; k++) if (!this.sh.rows[k]) this.sh.rows[k] = [];
    return this;
  };
  Range.prototype.clearContent = function () {
    for (var i = 0; i < this.nr; i++) { var R = this.sh.rows[this.r - 1 + i]; if (R) for (var j = 0; j < this.nc; j++) R[this.c - 1 + j] = ''; }
    return this;
  };
  ['setNumberFormat','setFontWeight','setBackground'].forEach(function (m) { Range.prototype[m] = function () { return this; }; });

  function Sheet(name) { this.name = name; this.rows = []; }
  Sheet.prototype.getName = function () { return this.name; };
  // เหมือน Sheets จริง: นับถึงแถวสุดท้ายที่มีข้อมูล (แถวที่ถูกล้างค่าไม่นับ)
  Sheet.prototype.getLastRow = function () {
    for (var i = this.rows.length - 1; i >= 0; i--) if ((this.rows[i] || []).some(function (v) { return v !== '' && v != null; })) return i + 1;
    return 0;
  };
  Sheet.prototype.getLastColumn = function () { return this.rows.reduce(function (m, r) { return Math.max(m, r.length); }, 0); };
  Sheet.prototype.getMaxRows = function () { return Math.max(1000, this.rows.length); };
  Sheet.prototype.getRange = function (r, c, nr, nc) { return new Range(this, r, c, nr || 1, nc || 1); };
  Sheet.prototype.getDataRange = function () { return new Range(this, 1, 1, Math.max(1, this.rows.length), Math.max(1, this.getLastColumn())); };
  Sheet.prototype.deleteRow = function (n) { this.rows.splice(n - 1, 1); };
  Sheet.prototype.setFrozenRows = function () {};

  function Spreadsheet(name) { this.name = name; this.sheets = [new Sheet('Sheet1')]; }
  Spreadsheet.prototype.getId = function () { return 'mock-sheet'; };
  Spreadsheet.prototype.getUrl = function () { return 'https://docs.google.com/spreadsheets/d/mock-sheet'; };
  Spreadsheet.prototype.getSheetByName = function (n) { return this.sheets.filter(function (s) { return s.name === n; })[0] || null; };
  Spreadsheet.prototype.insertSheet = function (n) { var s = new Sheet(n); this.sheets.push(s); return s; };
  Spreadsheet.prototype.getSheets = function () { return this.sheets.slice(); };
  Spreadsheet.prototype.deleteSheet = function (s) { this.sheets = this.sheets.filter(function (x) { return x !== s; }); };

  var DB = null, props = {}, cache = {}, files = {}, fileSeq = 0, trashed = {};
  var clock = { now: function () { return Date.now(); } };
  var outbox = [];

  G.SpreadsheetApp = {
    create: function (n) { DB = new Spreadsheet(n); return DB; },

  };
  G.PropertiesService = { getScriptProperties: function () { return {
    getProperty: function (k) { return k in props ? props[k] : null; },
    setProperty: function (k, v) { props[k] = String(v); } }; } };
  G.CacheService = { getScriptCache: function () { return {
    get: function (k) { var e = cache[k]; if (!e) return null; if (e.exp < clock.now()) { delete cache[k]; return null; } return e.v; },
    put: function (k, v, ttl) { cache[k] = { v: String(v), exp: clock.now() + (ttl || 600) * 1000 }; },
    remove: function (k) { delete cache[k]; } }; } };
  G.LockService = { getScriptLock: function () { return { waitLock: function () {}, releaseLock: function () {} }; } };
  G.MailApp = {
    sendEmail: function (o) { outbox.push(o); if (G.__onMail) G.__onMail(o); },
    getRemainingDailyQuota: function () { return 100 - outbox.length; }
  };
  G.Utilities = {
    DigestAlgorithm: { SHA_256: 'SHA_256' }, Charset: { UTF_8: 'UTF_8' },
    computeDigest: function (a, s) { return sha256Bytes(String(s)); },
    getUuid: function () { return 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function (c) { var r = Math.random() * 16 | 0; return (c === 'x' ? r : (r & 3 | 8)).toString(16); }); },
    base64Decode: function (b) { return { __b64: b }; },
    base64Encode: function (bytes) { return bytes.__b64; },
    newBlob: function (bytes, mime, name) { return { bytes: bytes, mime: mime, name: name }; }

  G.DriveApp = {

    getFolderById: function (fid) { return { createFile: function (blob) { var id = 'F' + (++fileSeq) + 'xxxxxxxxxxxx'; blob.folder = fid; files[id] = blob; return { getId: function () { return id; }, setSharing: function (a) { blob.sharing = a; } }; } }; },
    Access: { ANYONE_WITH_LINK: 'ANYONE_WITH_LINK' }, Permission: { VIEW: 'VIEW' },
    getFileById: function (id) {

               setTrashed: function (v) { trashed[id] = !!v; } };
    }
  };
  G.ContentService = { MimeType: { JSON: 'json' }, createTextOutput: function (s) { return { content: s, setMimeType: function () { return this; } }; } };
  G.ScriptApp = { getProjectTriggers: function () { return []; }, deleteTrigger: function () {}, newTrigger: function () { var b = { timeBased: function () { return b; }, everyDays: function () { return b; }, atHour: function () { return b; }, create: function () {} }; return b; } };
  G.__mock = { outbox: outbox, clock: clock, db: function () { return DB; }, cache: cache, files: files, trashed: trashed, props: props,

// ───────────────────────── Entry points ─────────────────────────
function doGet() {
  return json_({ ok: true, data: { service: APP.NAME + ' API', time: now_() } });
}

function doPost(e) {
  var out;
  _cache = {};
  try {
    var p = JSON.parse((e && e.postData && e.postData.contents) || '{}');
    var fn = ROUTES[p.action];
    if (!fn) throw err_('BAD_ACTION', 'ไม่รู้จักคำสั่งนี้');
    out = { ok: true, data: fn(p.data || {}, p) };
  } catch (x) {
    if (x && x.code) out = { ok: false, error: x.code, message: x.message };
    else { console.error(x && x.stack || x); out = { ok: false, error: 'SERVER', message: 'ระบบขัดข้อง ลองใหม่อีกครั้ง' }; }
  }
  return json_(out);
}

// ───────────────────────── Setup (รันเองใน editor) ─────────────────────────
function setup() {
  var props = PropertiesService.getScriptProperties();
  var id = props.getProperty('SHEET_ID');
  var ss = id ? SpreadsheetApp.openById(id) : SpreadsheetApp.create('INeedBio DB');
  props.setProperty('SHEET_ID', ss.getId());
  Object.keys(SCHEMA).forEach(function (name) {
    if (!ss.getSheetByName(name)) ss.insertSheet(name);
    _ss = ss;
    ensureCols_(name);
  });
  var def = ss.getSheetByName('Sheet1') || ss.getSheetByName('ชีต1');
  if (def && ss.getSheets().length > 1) ss.deleteSheet(def);
  var cur = allSettings_();
  Object.keys(DEFAULT_SETTINGS).forEach(function (k) { if (!(k in cur)) setSetting_(k, DEFAULT_SETTINGS[k]); });
  if (!props.getProperty('SLIP_FOLDER_ID')) props.setProperty('SLIP_FOLDER_ID', DriveApp.createFolder('INeedBio Slips').getId());
  publicFolder_(); avatarFolder_(); lessonFolder_();
  console.log('Sheet: ' + ss.getUrl());
  return ss.getId();
}

/** ตั้งผู้ใช้เป็นแอดมิน: รัน makeAdmin('you@gmail.com') หลังสมัครบนเว็บแล้ว */
function makeAdmin(email) {
  var u = findOne_('Users', function (r) { return r.email === String(email).trim().toLowerCase(); });
  if (!u) throw new Error('ไม่พบผู้ใช้ ' + email + ' (สมัครบนเว็บก่อน)');
  update_('Users', u._row, { role: 'admin' });
  var list = String(getSetting_('admin_emails') || '').split(',').map(trim_).filter(String);
  if (list.indexOf(u.email) < 0) { list.push(u.email); setSetting_('admin_emails', list.join(',')); }
  console.log(u.email + ' เป็นแอดมินแล้ว');
}

/** ลบ session ที่หมดอายุ — ตั้ง trigger รายวันด้วย installTriggers() */
function cleanup() {
  var t = Date.now();
  withLock_(function () {
    var rows = read_('Sessions').filter(function (s) { return new Date(s.expires_at).getTime() < t; });
    deleteRows_('Sessions', rows);
  });
}
function installTriggers() {
  ScriptApp.getProjectTriggers().forEach(function (t) { if (t.getHandlerFunction() === 'cleanup') ScriptApp.deleteTrigger(t); });
  ScriptApp.newTrigger('cleanup').timeBased().everyDays(1).atHour(3).create();
}

// ───────────────────────── Auth ─────────────────────────
function registerStart_(d) {
  var f = {
    email: normEmail_(d.email),
    first_name: req_(d.first_name, 'ชื่อ', 60), last_name: req_(d.last_name, 'นามสกุล', 60),
    nickname: req_(d.nickname, 'ชื่อเล่น', 30), school: req_(d.school, 'โรงเรียน', 120),
    grade: req_(d.grade, 'ระดับชั้น', 20), phone: phone_(d.phone)
  };
  goals_(d, f);
  if (d.accept_terms !== true && d.accept_terms !== 'true') throw err_('BAD_INPUT', 'กรุณายอมรับข้อตกลงการใช้งานและนโยบายความเป็นส่วนตัวก่อนสมัคร');
  f.terms_version = APP.TERMS_VERSION; f.terms_accepted_at = now_();
  checkPassword_(d.password);
  if (userByEmail_(f.email)) throw err_('EMAIL_TAKEN', 'อีเมลนี้สมัครไว้แล้ว ลองเข้าสู่ระบบหรือกดลืมรหัสผ่าน');
  rate_('otp1:' + f.email, 1, 60, 'รอ 1 นาทีก่อนขอรหัสใหม่');
  rate_('otpH:' + f.email, 6, 3600, 'ขอรหัสบ่อยเกินไป ลองใหม่ในอีก 1 ชั่วโมง');
  var salt = rand_(16);
  f.salt = salt; f.password_hash = hashPw_(d.password, salt);
  var otp = otp_();
  cache_().put('reg:' + f.email, JSON.stringify({ otp: sha256_(otp), tries: 0, f: f }), APP.OTP_MINUTES * 60);
  sendOtpEmail_(f.email, otp, f.nickname, 'register');
  return { email: f.email, expires_in: APP.OTP_MINUTES * 60 };
}

function registerVerify_(d, p) {
  var email = normEmail_(d.email);
  var key = 'reg:' + email;
  var st = checkOtp_(key, d.otp);
  return withLock_(function () {
    ensureCols_('Users');
    if (userByEmail_(email)) throw err_('EMAIL_TAKEN', 'อีเมลนี้สมัครไว้แล้ว');
    var f = st.f;
    var u = {
      user_id: 'U' + id_(), email: email, password_hash: f.password_hash, salt: f.salt,
      first_name: f.first_name, last_name: f.last_name, nickname: f.nickname, school: f.school,
      grade: f.grade, phone: f.phone, role: 'student', status: 'active', created_at: now_(), last_login_at: now_(),
      current_faculty: f.current_faculty, current_university: f.current_university, dream_faculty: f.dream_faculty, dream_university: f.dream_university,
      terms_version: f.terms_version, terms_accepted_at: f.terms_accepted_at
    };
    append_('Users', u);
    cache_().remove(key);
    return { token: newSession_(u.user_id, p), user: publicUser_(u) };
  });
}

function login_(d, p) {
  var email = normEmail_(d.email);
  rate_('login:' + email, 8, 900, 'ลองเข้าสู่ระบบหลายครั้งเกินไป รอ 15 นาทีแล้วลองใหม่');
  var u = userByEmail_(email);
  if (!u || hashPw_(String(d.password || ''), u.salt) !== u.password_hash) throw err_('BAD_LOGIN', 'อีเมลหรือรหัสผ่านไม่ถูกต้อง');
  if (u.status !== 'active') throw err_('BANNED', 'บัญชีนี้ถูกระงับ ติดต่อแอดมินทาง IG');
  return withLock_(function () {
    update_('Users', u._row, { last_login_at: now_() });
    return { token: newSession_(u.user_id, p), user: publicUser_(u) };
  });
}

function logout_(d, p) {
  var th = sha256_(String(p.token || ''));
  withLock_(function () { deleteRows_('Sessions', read_('Sessions').filter(function (s) { return s.token_hash === th; })); });
  cache_().remove('s:' + th);
  return true;
}

function passwordForgot_(d) {
  var email = normEmail_(d.email);
  var u = userByEmail_(email);
  if (u && u.status === 'active') {
    rate_('otp1:' + email, 1, 60, 'รอ 1 นาทีก่อนขอรหัสใหม่');
    rate_('otpH:' + email, 6, 3600, 'ขอรหัสบ่อยเกินไป ลองใหม่ในอีก 1 ชั่วโมง');
    var otp = otp_();
    cache_().put('rst:' + email, JSON.stringify({ otp: sha256_(otp), tries: 0 }), APP.OTP_MINUTES * 60);
    sendOtpEmail_(email, otp, u.nickname, 'reset');
  }
  return { email: email }; // ตอบเหมือนกันเสมอ ไม่บอกว่ามีอีเมลนี้ในระบบไหม
}

function passwordReset_(d, p) {

  return withLock_(function () {
    var u = userByEmail_(email);
    if (!u) throw err_('OTP_INVALID', 'รหัสไม่ถูกต้อง');
    var salt = rand_(16);
    update_('Users', u._row, { salt: salt, password_hash: hashPw_(d.password, salt), last_login_at: now_() });
    cache_().remove('rst:' + email);
    return { token: newSession_(u.user_id, p), user: publicUser_(u) };
  });
}

function passwordChange_(d, p) {
  var u = auth_(p);

  checkPassword_(d.password);
  var salt = rand_(16);
  withLock_(function () { update_('Users', u._row, { salt: salt, password_hash: hashPw_(d.password, salt) }); });

}

/** สร้าง session ใหม่ และเตะ session เก่าของผู้ใช้คนนี้ออกทั้งหมด (1 บัญชี = 1 เครื่อง) — ต้องเรียกภายใน lock */
function newSession_(userId, p) {
  var old = read_('Sessions').filter(function (s) { return s.user_id === userId; });
  old.forEach(function (s) {
    cache_().remove('s:' + s.token_hash);
    if (s.device_id !== String(p.device_id || '')) cache_().put('gone:' + s.token_hash, '1', 21600);
  });
  deleteRows_('Sessions', old);
  var token = rand_(32);
  append_('Sessions', {
    token_hash: sha256_(token), user_id: userId,
    device_id: clip_(p.device_id, 64), device_info: clip_(p.device_info, 120),
    created_at: now_(), expires_at: new Date(Date.now() + APP.SESSION_DAYS * 864e5).toISOString()
  });
  return token;
}

function auth_(p) {
  var token = String((p && p.token) || '');
  if (!token) throw err_('AUTH', 'กรุณาเข้าสู่ระบบ');
  var th = sha256_(token);
  var uid = cache_().get('s:' + th);
  if (!uid) {
    var s = findOne_('Sessions', function (r) { return r.token_hash === th; });
    if (!s) {
      if (cache_().get('gone:' + th)) throw err_('SESSION_REPLACED', 'บัญชีนี้ถูกเข้าสู่ระบบจากอุปกรณ์อื่น จึงออกจากระบบในเครื่องนี้แล้ว');
      throw err_('AUTH', 'เซสชันหมดอายุ กรุณาเข้าสู่ระบบใหม่');
    }
    if (new Date(s.expires_at).getTime() < Date.now()) throw err_('AUTH', 'เซสชันหมดอายุ กรุณาเข้าสู่ระบบใหม่');
    uid = s.user_id;
    cache_().put('s:' + th, uid, 600);
  }
  var u = findOne_('Users', function (r) { return r.user_id === uid; });
  if (!u) throw err_('AUTH', 'กรุณาเข้าสู่ระบบ');
  if (u.status !== 'active') throw err_('BANNED', 'บัญชีนี้ถูกระงับ ติดต่อแอดมินทาง IG');
  return u;
}

function adminOnly_(fn) {
  return function (d, p) {
    var u = auth_(p);
    if (u.role !== 'admin') throw err_('FORBIDDEN', 'หน้านี้สำหรับแอดมินเท่านั้น');
    return fn(d, p, u);
  };
}

function checkOtp_(key, otp) {
  var raw = cache_().get(key);
  if (!raw) throw err_('OTP_EXPIRED', 'รหัสหมดอายุแล้ว กดขอรหัสใหม่');
  var st = JSON.parse(raw);
  if (st.tries >= APP.OTP_MAX_TRIES) { cache_().remove(key); throw err_('OTP_EXPIRED', 'กรอกผิดเกิน 5 ครั้ง กดขอรหัสใหม่'); }
  if (sha256_(String(otp || '').replace(/\D/g, '')) !== st.otp) {
    st.tries++;
    cache_().put(key, JSON.stringify(st), APP.OTP_MINUTES * 60);
    throw err_('OTP_INVALID', 'รหัสไม่ถูกต้อง (เหลืออีก ' + (APP.OTP_MAX_TRIES - st.tries) + ' ครั้ง)');
  }
  return st;
}

// ───────────────────────── คอร์ส (สาธารณะ) ─────────────────────────
function publishedCourses_() {
  var c = cache_().get('pub_courses');
  if (c) return JSON.parse(c);
  var lessons = read_('Lessons');
  var list = read_('Courses').filter(function (x) { return x.status === 'published'; })
    .sort(bySort_).map(function (x) { return courseCard_(x, lessons); });
  cache_().put('pub_courses', JSON.stringify(list), 300);
  return list;
}

function courseCard_(x, lessons) {
  var ls = lessons.filter(function (l) { return l.course_id === x.course_id; });
  var mins = ls.reduce(function (a, l) { return a + (Number(l.duration_min) || 0); }, 0);
  return {
    course_id: x.course_id, subject: x.subject, subject_name: APP.SUBJECTS[x.subject] || x.subject,
    title: x.title, subtitle: x.subtitle, description: x.description, cover_url: x.cover_url,
    price: Number(x.price) || 0, full_price: Number(x.full_price) || 0, level: x.level || '', status: x.status, lesson_count: ls.length, total_min: mins
  };
}

function courseDetail_(d, p) {
  var x = findOne_('Courses', function (r) { return r.course_id === d.course_id; });
  if (!x || x.status !== 'published') throw err_('NOT_FOUND', 'ไม่พบคอร์สนี้');
  var lessons = read_('Lessons');
  var out = courseCard_(x, lessons);
  out.chapters = chapters_(lessons.filter(function (l) { return l.course_id === x.course_id; }), function (l) {
    var pv = truthy_(l.is_preview);
    return { lesson_id: l.lesson_id, title: l.title, duration_min: Number(l.duration_min) || 0, is_preview: pv, youtube_id: pv ? l.youtube_id : '' };
  });
  out.trailer_id = x.trailer_youtube || '';
  out.highlights = lines_(x.highlights, 12, 200);
  out.audience = lines_(x.audience, 10, 200);
  out.instructor = x.instructor_name ? { name: x.instructor_name, title: x.instructor_title || '', bio: x.instructor_bio || '', photo: x.instructor_photo || '' } : null;
  out.faq = parseFaq_(x.faq);
  // บัญชีรับเงินของคอร์สนี้ (ไม่ตั้ง = ใช้บัญชีกลางจากหน้าตั้งค่า) · qr_url = รูป QR ที่อัปโหลดเอง ใช้แทน QR ที่ระบบสร้าง
  out.pay = {
    promptpay_id: x.promptpay_id || getSetting_('promptpay_id'),
    promptpay_name: x.promptpay_id ? (x.promptpay_name || '') : (x.promptpay_name || getSetting_('promptpay_name')),
    qr_url: x.payment_qr_url || ''
  };
  out.enrollment = null;
  if (p.token) {
    try { var u = auth_(p); var e = latestEnroll_(u.user_id, x.course_id); out.enrollment = e ? e.status : null; out.note = e ? e.note : ''; } catch (ignore) {}
  }
  return out;
}

// ───────────────────────── นักเรียน ─────────────────────────
function myCourses_(d, p) {
  var u = auth_(p);
  var courses = read_('Courses'), lessons = read_('Lessons');
  var prog = read_('Progress').filter(function (r) { return r.user_id === u.user_id; });
  var seen = {};
  return read_('Enrollments').filter(function (e) { return e.user_id === u.user_id; })
    .sort(function (a, b) { return a.created_at < b.created_at ? 1 : -1; })
    .filter(function (e) { if (seen[e.course_id]) return false; seen[e.course_id] = 1; return true; })
    .map(function (e) {
      var c = courses.filter(function (x) { return x.course_id === e.course_id; })[0];
      if (!c) return null;
      var card = courseCard_(c, lessons);
      var ids = lessons.filter(function (l) { return l.course_id === c.course_id; }).map(function (l) { return l.lesson_id; });
      var done = prog.filter(function (r) { return ids.indexOf(r.lesson_id) >= 0; });
      var last = done.sort(function (a, b) { return a.completed_at < b.completed_at ? 1 : -1; })[0];
      card.enrollment = e.status; card.note = e.note; card.requested_at = e.created_at;
      card.done_count = done.length;
      card.percent = ids.length ? Math.round(done.length / ids.length * 100) : 0;
      card.last_lesson_id = last ? last.lesson_id : '';
      return card;
    }).filter(Boolean);
}

function learnGet_(d, p) {
  var u = auth_(p);
  var x = findOne_('Courses', function (r) { return r.course_id === d.course_id; });
  if (!x) throw err_('NOT_FOUND', 'ไม่พบคอร์สนี้');
  var e = latestEnroll_(u.user_id, x.course_id);
  var ok = u.role === 'admin' || (e && e.status === 'approved');
  if (!ok) throw err_('NO_ACCESS', 'คอร์สนี้ยังไม่ได้รับสิทธิ์เข้าเรียน');
  var lessons = read_('Lessons');
  var done = {};
  read_('Progress').forEach(function (r) { if (r.user_id === u.user_id && r.course_id === x.course_id) done[r.lesson_id] = 1; });
  var out = courseCard_(x, lessons);
  out.chapters = chapters_(lessons.filter(function (l) { return l.course_id === x.course_id; }), function (l) {
    return { lesson_id: l.lesson_id, title: l.title, duration_min: Number(l.duration_min) || 0, youtube_id: l.youtube_id,
             attachment_url: l.attachment_url, files: parseFiles_(l.attachment_url), done: !!done[l.lesson_id] };
  });
  out.watermark = u.email + ' · ' + u.user_id;
  return out;
}

function progressSet_(d, p) {
  var u = auth_(p);
  var l = findOne_('Lessons', function (r) { return r.lesson_id === d.lesson_id; });
  if (!l) throw err_('NOT_FOUND', 'ไม่พบบทเรียน');
  var e = latestEnroll_(u.user_id, l.course_id);
  if (u.role !== 'admin' && !(e && e.status === 'approved')) throw err_('NO_ACCESS', 'ยังไม่ได้รับสิทธิ์');
  withLock_(function () {
    var rows = read_('Progress').filter(function (r) { return r.user_id === u.user_id && r.lesson_id === l.lesson_id; });
    if (d.done && !rows.length) append_('Progress', { user_id: u.user_id, course_id: l.course_id, lesson_id: l.lesson_id, completed_at: now_() });
    if (!d.done && rows.length) deleteRows_('Progress', rows);
  });
  return { lesson_id: l.lesson_id, done: !!d.done };
}

function enrollRequest_(d, p) {
  var u = auth_(p);
  var c = findOne_('Courses', function (r) { return r.course_id === d.course_id; });
  if (!c || c.status !== 'published') throw err_('NOT_FOUND', 'ไม่พบคอร์สนี้');
  var prev = latestEnroll_(u.user_id, c.course_id);
  if (prev && prev.status === 'approved') throw err_('ALREADY', 'คุณมีสิทธิ์เข้าเรียนคอร์สนี้แล้ว');
  if (prev && prev.status === 'pending') throw err_('ALREADY', 'ส่งสลิปไปแล้ว กำลังรอแอดมินตรวจ');
  var s = d.slip || {};
  if (!/^image\/(jpeg|png|webp)$/.test(s.mime || '')) throw err_('BAD_INPUT', 'แนบสลิปเป็นรูปภาพ (JPG หรือ PNG)');
  if (!s.base64 || s.base64.length * 0.75 > APP.SLIP_MAX_BYTES) throw err_('BAD_INPUT', 'รูปสลิปใหญ่เกิน 3 MB');
  rate_('slip:' + u.user_id, 5, 3600, 'ส่งสลิปบ่อยเกินไป ลองใหม่ภายหลัง');
  var folder = DriveApp.getFolderById(PropertiesService.getScriptProperties().getProperty('SLIP_FOLDER_ID'));
  var enrollId = 'E' + id_();
  var ext = s.mime === 'image/png' ? 'png' : 'jpg';
  var file = folder.createFile(Utilities.newBlob(Utilities.base64Decode(s.base64), s.mime, enrollId + '_' + u.user_id + '.' + ext));
  var e = {
    enroll_id: enrollId, user_id: u.user_id, course_id: c.course_id, status: 'pending',
    amount: String(Number(c.price) || 0), slip_file_id: file.getId(), note: '', created_at: now_(), decided_by: '', decided_at: ''
  };
  withLock_(function () { append_('Enrollments', e); });
  notifyAdmins_('มีคำขอเข้าเรียนใหม่: ' + c.title,
    [['นักเรียน', u.first_name + ' ' + u.last_name + ' (' + u.nickname + ')'], ['อีเมล', u.email], ['เบอร์', u.phone],
     ['คอร์ส', c.title], ['ยอดที่ต้องโอน', '฿' + e.amount], ['รหัสคำขอ', enrollId]],
    'เข้าหลังบ้าน → คำขอเข้าเรียน เพื่อตรวจสลิปและอนุมัติ');
  return { enroll_id: enrollId, status: 'pending' };
}

// ───────────────────────── แอดมิน ─────────────────────────
function adminStats_() {
  var users = read_('Users'), en = read_('Enrollments'), courses = read_('Courses');
  var today = now_().slice(0, 10), month = now_().slice(0, 7);
  var subj = {};
  Object.keys(APP.SUBJECTS).forEach(function (k) { subj[k] = { subject: k, name: APP.SUBJECTS[k], count: 0, revenue: 0 }; });
  var revenue = 0, monthCount = 0;
  en.forEach(function (e) {
    if (e.status !== 'approved' || String(e.decided_at).slice(0, 7) !== month) return;
    var c = courses.filter(function (x) { return x.course_id === e.course_id; })[0];
    var amt = Number(e.amount) || 0; revenue += amt; monthCount++;
    if (c && subj[c.subject]) { subj[c.subject].count++; subj[c.subject].revenue += amt; }
  });
  return {
    users_total: users.length,
    dream_top: topCount_(users.map(function (u) { return u.dream_faculty && u.dream_university ? u.dream_faculty + ' · ' + u.dream_university : ''; }), 6),
    repeat_count: users.filter(function (u) { return isRepeat_(u.grade); }).length,
    users_today: users.filter(function (u) { return String(u.created_at).slice(0, 10) === today; }).length,
    pending: en.filter(function (e) { return e.status === 'pending'; }).length,
    oldest_pending: en.filter(function (e) { return e.status === 'pending'; }).map(function (e) { return e.created_at; }).sort()[0] || '',
    month_revenue: revenue, month_count: monthCount,
    by_subject: Object.keys(subj).map(function (k) { return subj[k]; }),
    email_quota: MailApp.getRemainingDailyQuota()
  };
}

function adminDecide_(d, p, admin) {
  var decision = d.decision === 'approve' ? 'approved' : d.decision === 'reject' ? 'rejected' : '';
  if (!decision) throw err_('BAD_INPUT', 'เลือกอนุมัติหรือปฏิเสธ');
  var info = withLock_(function () {
    var e = findOne_('Enrollments', function (r) { return r.enroll_id === d.enroll_id; });

    if (e.status !== 'pending') throw err_('ALREADY', 'คำขอนี้ถูกตัดสินไปแล้วโดยแอดมินคนอื่น');
    update_('Enrollments', e._row, { status: decision, note: clip_(d.note, 300), decided_by: admin.user_id, decided_at: now_() });
    log_(admin, decision, e.enroll_id);
    return e;
  });
  var u = findOne_('Users', function (r) { return r.user_id === info.user_id; });
  var c = findOne_('Courses', function (r) { return r.course_id === info.course_id; });
  if (u && c) sendDecisionEmail_(u, c, decision, d.note);
  return { enroll_id: info.enroll_id, status: decision };
}

  withLock_(function () {
    if (prev && prev.status === 'pending') update_('Enrollments', prev._row, { status: 'approved', note: 'อนุมัติโดยการเพิ่มสิทธิ์', decided_by: admin.user_id, decided_at: now_() });
    else append_('Enrollments', { enroll_id: 'E' + id_(), user_id: u.user_id, course_id: c.course_id, status: 'approved',

function adminCourseSave_(d, p, admin) {
  if (!APP.SUBJECTS[d.subject]) throw err_('BAD_INPUT', 'เลือกวิชา');

  if (!(price >= 0)) throw err_('BAD_INPUT', 'ราคาต้องเป็นตัวเลข');

function adminStudents_() {
  var users = read_('Users'), courses = read_('Courses').sort(bySort_), cById = {}, enByUser = {}, sesByUser = {};
  courses.forEach(function (c) { cById[c.course_id] = c; });
  read_('Enrollments').sort(function (a, b) { return a.created_at < b.created_at ? 1 : -1; }).forEach(function (e) { (enByUser[e.user_id] = enByUser[e.user_id] || []).push(e); });
  read_('Sessions').forEach(function (s) { sesByUser[s.user_id] = s; });
  var rows = [];
  users.sort(function (a, b) { return a.created_at < b.created_at ? 1 : -1; }).forEach(function (u) {
    var s = sesByUser[u.user_id], seen = {};
    var base = publicUser_(u);
    base.note = u.admin_note || ''; base.no_email = isPlaceholderEmail_(u.email); base.last_login_at = u.last_login_at || '';
    base.device = s ? s.device_info : ''; base.device_since = s ? s.created_at : '';
    var mine = (enByUser[u.user_id] || []).filter(function (e) { if (seen[e.course_id]) return false; seen[e.course_id] = 1; return true; });
    if (!mine.length) rows.push(Object.assign({}, base, { enroll_id: '', course_id: '', course_title: '', amount: 0, pay_status: '', enrolled_at: '', has_slip: false }));
    mine.forEach(function (e) {
      var c = cById[e.course_id] || {};
      rows.push(Object.assign({}, base, { enroll_id: e.enroll_id, course_id: e.course_id, course_title: c.title || e.course_id, amount: Number(e.amount) || 0,
        pay_status: e.status, enrolled_at: e.created_at, has_slip: !!e.slip_file_id }));
    });
  });
  return { rows: rows, courses: courses.map(function (c) { return { course_id: c.course_id, title: c.title, price: Number(c.price) || 0 }; }),
    camp: { centers: APP.CAMP_CENTERS, subjects: APP.CAMP_SUBJECTS } };
}

/** เพิ่มคอร์สให้นักเรียนที่มีอยู่แล้ว (ใช้ได้ทั้งนักเรียนที่ไม่มีอีเมล) */
function adminStudentEnroll_(d, p, admin) {
  var c = findOne_('Courses', function (r) { return r.course_id === d.course_id; });
  if (!c) throw err_('NOT_FOUND', 'ไม่พบคอร์ส');
  var pay = d.pay_status || 'approved';
  if (APP.PAY_STATUSES.indexOf(pay) < 0) throw err_('BAD_INPUT', 'สถานะการชำระเงินไม่ถูกต้อง');
  var amount = d.amount === '' || d.amount == null ? Number(c.price) || 0 : Math.max(0, Number(d.amount) || 0);
  var out = withLock_(function () {
    var u = findOne_('Users', function (r) { return r.user_id === d.user_id; });
    if (!u) throw err_('NOT_FOUND', 'ไม่พบนักเรียน');
    var prev = latestEnroll_(u.user_id, c.course_id);
    if (prev && (prev.status === 'approved' || prev.status === 'pending')) throw err_('ALREADY', 'นักเรียนคนนี้มีคอร์สนี้อยู่แล้ว เปลี่ยนสถานะในตารางแทน');
    var eid = addEnroll_(u.user_id, c.course_id, pay, amount, admin);
    log_(admin, 'student.enroll', u.email + ' → ' + c.course_id + ' ' + pay);
    return { u: u, eid: eid };
  });
  if (pay === 'approved' && !isPlaceholderEmail_(out.u.email)) sendDecisionEmail_(out.u, c, 'approved', '');
  return { enroll_id: out.eid };
}

/** บันทึกหลายรายการพร้อมกัน: updates = [{ user_id, note?, enroll_id?, pay_status? }] */
function adminStudentsSave_(d, p, admin) {
  var ups = Array.isArray(d.updates) ? d.updates.slice(0, 500) : [];
  var approved = [];
  withLock_(function () {
    ensureCols_('Users');
    var users = {}, ens = {};
    read_('Users').forEach(function (u) { users[u.user_id] = u; });
    read_('Enrollments').forEach(function (e) { ens[e.enroll_id] = e; });
    ups.forEach(function (x) {
      var u = users[x.user_id];
      if (!u) throw err_('NOT_FOUND', 'ไม่พบนักเรียน');
      if ('note' in x && clip_(x.note, 500) !== (u.admin_note || '')) { update_('Users', u._row, { admin_note: clip_(x.note, 500) }); u.admin_note = clip_(x.note, 500); }
      if (!x.enroll_id || !x.pay_status) return;
      if (APP.PAY_STATUSES.indexOf(x.pay_status) < 0) throw err_('BAD_INPUT', 'สถานะการชำระเงินไม่ถูกต้อง');
      var e = ens[x.enroll_id];
      if (!e || e.user_id !== u.user_id) throw err_('NOT_FOUND', 'ไม่พบรายการลงทะเบียน');
      if (e.status === x.pay_status) return;
      var patch = { status: x.pay_status, decided_by: x.pay_status === 'pending' ? '' : admin.user_id, decided_at: x.pay_status === 'pending' ? '' : now_() };
      if (e.status === 'rejected') patch.note = '';
      update_('Enrollments', e._row, patch);
      log_(admin, 'student.pay', e.enroll_id + ' ' + e.status + '→' + x.pay_status);
      if (x.pay_status === 'approved') approved.push({ u: u, course_id: e.course_id });
      e.status = x.pay_status;
    });
  });
  approved.forEach(function (a) {
    var c = findOne_('Courses', function (r) { return r.course_id === a.course_id; });
    if (c && !isPlaceholderEmail_(a.u.email)) sendDecisionEmail_(a.u, c, 'approved', '');
  });
  return { saved: ups.length };
}
